<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicación - NAVYBLUE</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%233f4f68'/%3E%3Cpath d='M6 6.5C6 5.7 6.7 5 7.5 5H12v14H7.5C6.7 19 6 18.3 6 17.5v-11z' fill='%23f5efe1'/%3E%3Cpath d='M18 6.5c0-.8-.7-1.5-1.5-1.5H12v14h4.5c.8 0 1.5-.7 1.5-1.5v-11z' fill='%23c08a4e'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header id="inicio-header">
        <div class="header-content">
            <div class="header-title">
                <h1>NAVYBLUE</h1>
                <p>MI MUJERL DE 17 AÑOS</p>
            </div>
            <div class="header-acciones"></div>
        </div>
    </header>

    <main class="contenedor-principal" style="justify-content: center; display: flex;">
        <section class="columna-centro" style="max-width: 700px; width: 100%;">
            <a href="javascript:void(0)" id="link-volver" style="display: inline-block; margin-bottom: 12px; color: #34517c; font-weight: bold; text-decoration: none; font-size: 0.9rem;">← Volver</a>

            <div id="post-detalle">
                <p style="color: #888;">Cargando...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Desarrollado por: mis dos cojones</p>
    </footer>

    <script src="js/ui-comunes.js"></script>
    <script src="js/header-comun.js"></script>
    <script src="js/posts-comunes.js"></script>
    <script>
        // "← Volver": si venimos de otra página del sitio, volvemos a esa
        // página; si el post se abrió directo (link compartido, pestaña
        // nueva), no hay historial de este sitio, así que vamos al inicio.
        document.getElementById('link-volver').addEventListener('click', () => {
            if (document.referrer && document.referrer.includes(location.host)) {
                history.back();
            } else {
                window.location.href = 'index.html';
            }
        });

        (async () => {
            await montarHeaderComun({ reemplazarBotonesInvitado: true });

            const params = new URLSearchParams(location.search);
            const postId = params.get('id');
            const contenedor = document.getElementById('post-detalle');

            if (!postId) {
                contenedor.innerHTML = '<p>No se indicó qué publicación mostrar.</p>';
                return;
            }

            // Reutilizamos exactamente la misma lógica de detalle (con
            // comentarios, borrar comentario propio, "respondiendo a", etc.)
            // que usa el panel en línea del muro/inicio, pero en su propia
            // página. El botón "← Volver" de adentro de renderDetallePost no
            // se usa acá (dejamos el de arriba, que sabe volver de verdad).
            await abrirDetallePost(postId, contenedor);
            const btnVolverInterno = contenedor.querySelector('button');
            if (btnVolverInterno && btnVolverInterno.textContent.includes('Volver')) {
                btnVolverInterno.remove();
            }
        })();
    </script>
</body>
</html>
