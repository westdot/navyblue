<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - NAVYBLUE</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%233f4f68'/%3E%3Cpath d='M6 6.5C6 5.7 6.7 5 7.5 5H12v14H7.5C6.7 19 6 18.3 6 17.5v-11z' fill='%23f5efe1'/%3E%3Cpath d='M18 6.5c0-.8-.7-1.5-1.5-1.5H12v14h4.5c.8 0 1.5-.7 1.5-1.5v-11z' fill='%23c08a4e'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- TÍTULO PRINCIPAL Y OPCIONES (Mismo header del index) -->
    <header id="inicio-header">
        <div class="header-content">
            <div class="header-title">
                <h1>NAVYBLUE</h1>
                <p>victimas de la pobreza</p>
            </div>

            <div class="header-acciones">
            </div>
        </div>
    </header>

    <!-- ESTRUCTURA PRINCIPAL PARA EL FORMULARIO DE REGISTRO -->
    <main class="contenedor-principal" style="justify-content: center; display: flex;">

        <section class="columna-centro" style="max-width: 500px; width: 100%; margin-top: 20px;">
            <h2>Crear Cuenta Nueva</h2>

            <!-- Caja con el estilo del muro para albergar el formulario -->
            <div class="publicar-box" style="padding: 25px;">
                <form id="registerForm">
                    <div class="form-grupo" style="margin-bottom: 15px;">
                        <label for="name" style="display: block; margin-bottom: 5px;">Nombre</label>
                        <input type="text" id="name" class="form-control" placeholder="Tu nombre" required style="width: 100%; padding: 10px; box-sizing: border-box;">
                    </div>

                    <div class="form-grupo" style="margin-bottom: 15px;">
                        <label for="username" style="display: block; margin-bottom: 5px;">Usuario</label>
                        <input type="text" id="username" class="form-control" placeholder="@ejemplo" required style="width: 100%; padding: 10px; box-sizing: border-box;">
                    </div>

                    <div class="form-grupo" style="margin-bottom: 15px;">
                        <label for="email" style="display: block; margin-bottom: 5px;">Correo electrónico</label>
                        <input type="email" id="email" class="form-control" placeholder="tucorreo@ejemplo.com" required style="width: 100%; padding: 10px; box-sizing: border-box;">
                    </div>

                    <div class="form-grupo" style="margin-bottom: 20px;">
                        <label for="password" style="display: block; margin-bottom: 5px;">Contraseña</label>
                        <input type="password" id="password" class="form-control" placeholder="********" required style="width: 100%; padding: 10px; box-sizing: border-box;">
                    </div>

                    <button type="submit" class="btn-entrar" style="width: 100%; padding: 12px; cursor: pointer;">Registrarse</button>
                </form>

                <p id="mensaje" style="margin-top: 15px; text-align: center; font-weight: bold;"></p>
            </div>
        </section>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <p>Desarrollado por: mis dos cojones</p>
        <p><a href="#inicio-header">Volver al inicio de la página</a></p>
    </footer>

    <!-- SCRIPT DE CONEXIÓN CON EL BACKEND (/api/register) -->
    <script src="js/ui-comunes.js"></script>
    <script src="js/header-comun.js"></script>
    <script>
    window.addEventListener('DOMContentLoaded', () => montarHeaderComun());
    const registerForm = document.getElementById('registerForm');
    const mensaje = document.getElementById('mensaje');

    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('name').value;
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const pais = document.getElementById('pais').value.trim();

        try {
            const response = await fetch('/api/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name, username, email, password, pais })
            });

            const data = await response.json();

            if (response.ok) {
                mensaje.style.color = 'green';
                mensaje.textContent = '¡Registro exitoso! Redirigiendo al inicio...';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            } else {
                mensaje.style.color = 'red';
                mensaje.textContent = data.error || 'Ocurrió un error al registrarse.';
            }
        } catch (error) {
            mensaje.style.color = 'red';
            mensaje.textContent = 'No se pudo conectar con el servidor.';
        }
    });
</script>

</body>
</html>
