<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - NAVYBLUE</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%233f4f68'/%3E%3Cpath d='M6 6.5C6 5.7 6.7 5 7.5 5H12v14H7.5C6.7 19 6 18.3 6 17.5v-11z' fill='%23f5efe1'/%3E%3Cpath d='M18 6.5c0-.8-.7-1.5-1.5-1.5H12v14h4.5c.8 0 1.5-.7 1.5-1.5v-11z' fill='%23c08a4e'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- titulo y opcines (son las mismas del index.html) -->
    <header id="inicio-header">
        <div class="header-content">
            <div class="header-title">
                <h1>NAVYBLUE</h1>
                <p>victimas</p>
            </div>

            <div class="header-acciones">
            </div>
        </div>
    </header>

    <!-- est princ del perfil -->
    <main class="contenedor-principal" style="display: flex; align-items: flex-start; gap: 40px; justify-content: center;">

        <!-- izq, las config ya existentes (hay que añadir el correo deo confirmacion para cambiar contraseña (seguridad po wn ponte serio)) -->
        <section class="columna-centro" style="max-width: 420px; width: 100%; margin-top: 20px; flex-shrink: 0;">
            <h2>Mi Perfil</h2>

            <!-- datos del perfil -->
            <div class="publicar-box" style="padding: 15px;">
                <form id="profileForm">
                    <div class="form-grupo" style="margin-bottom: 15px;">
                        <label for="name" style="display: block; margin-bottom: 5px;">Nombre</label>
                        <input type="text" id="name" class="form-control" required style="width: 100%; padding: 10px; box-sizing: border-box;">
                    </div>

                    <div class="form-grupo" style="margin-bottom: 15px;">
                        <label for="username" style="display: block; margin-bottom: 5px;">Username</label>
                        <input type="text" id="username" class="form-control" required style="width: 100%; padding: 10px; box-sizing: border-box;">
                    </div>

                    <div class="form-grupo" style="margin-bottom: 20px;">
                        <label for="email" style="display: block; margin-bottom: 5px;">Correo electrónico</label>
                        <input type="email" id="email" class="form-control" required style="width: 100%; padding: 10px; box-sizing: border-box;">
                    </div>

                    <div class="form-grupo" style="margin-bottom: 20px;">
                        <label for="pais" style="display: block; margin-bottom: 5px;">País</label>
                        <input type="text" id="pais" class="form-control" placeholder="Ej: Chile" style="width: 100%; padding: 10px; box-sizing: border-box;">
                    </div>

                    <button type="submit" class="btn-entrar" style="width: 100%; padding: 12px; cursor: pointer;">Guardar cambios</button>
                </form>

                <p id="mensajePerfil" style="margin-top: 15px; text-align: center; font-weight: bold;"></p>
            </div>

            <!-- cambio de contraseña dejado por seguridad ahi separado -->
            <div class="publicar-box" style="padding: 25px; margin-top: 20px;">
                <h3 style="margin-top: 0;">Cambiar contraseña</h3>
                <form id="passwordForm">
                    <div class="form-grupo" style="margin-bottom: 15px;">
                        <label for="currentPassword" style="display: block; margin-bottom: 5px;">Contraseña actual</label>
                        <input type="password" id="currentPassword" class="form-control" required style="width: 100%; padding: 10px; box-sizing: border-box;">
                    </div>

                    <div class="form-grupo" style="margin-bottom: 15px;">
                        <label for="newPassword" style="display: block; margin-bottom: 5px;">Contraseña nueva</label>
                        <input type="password" id="newPassword" class="form-control" required minlength="6" style="width: 100%; padding: 10px; box-sizing: border-box;">
                    </div>

                    <div class="form-grupo" style="margin-bottom: 20px;">
                        <label for="confirmPassword" style="display: block; margin-bottom: 5px;">Confirmar contraseña nueva</label>
                        <input type="password" id="confirmPassword" class="form-control" required minlength="6" style="width: 100%; padding: 10px; box-sizing: border-box;">
                    </div>

                    <button type="submit" class="btn-entrar" style="width: 100%; padding: 12px; cursor: pointer;">Actualizar contraseña</button>
                </form>

                <p id="mensajePassword" style="margin-top: 15px; text-align: center; font-weight: bold;"></p>
            </div>
        </section>

        <!-- derecha (pensar que wea ponerles wn) -->
        <section class="columna-derecha" style="flex: 1; max-width: 700px; margin-top: 20px; min-height: 400px;">
            <h2>Más opciones</h2>
            <div id="config-extra-contenedor" style="display: flex; align-items: center; justify-content: center; min-height: 300px;">
            </div>
        </section>

    </main>

    <!-- pie de pagina -->
    <footer>
        <p>Desarrollado por: mis dos cojones</p>
    </footer>

    <script src="js/ui-comunes.js"></script>
    <script src="js/header-comun.js"></script>
    <script>
    const profileForm = document.getElementById('profileForm');
    const mensajePerfil = document.getElementById('mensajePerfil');
    const passwordForm = document.getElementById('passwordForm');
    const mensajePassword = document.getElementById('mensajePassword');

    // al cargar la pagina pedimos los datos reales al servidor.
    // si no hay sesión activa, nos devuelve a la portada.
    async function cargarPerfil() {
        try {
            const response = await fetch('/api/profile');
            if (!response.ok) {
                window.location.href = 'index.html';
                return;
            }
            const data = await response.json();
            document.getElementById('name').value = data.user.name;
            document.getElementById('username').value = data.user.username;
            document.getElementById('email').value = data.user.email;
            document.getElementById('pais').value = data.user.pais || '';
        } catch (error) {
            window.location.href = 'index.html';
        }
    }

    // guardar cambios de nombre / usuario / correo
    profileForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('name').value.trim();
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const pais = document.getElementById('pais').value.trim();

        try {
            const response = await fetch('/api/profile', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, username, email, pais })
            });

            const data = await response.json();

            if (response.ok) {
                mensajePerfil.style.color = 'green';
                mensajePerfil.textContent = '¡Perfil actualizado con éxito!';
                // como localStorage se usa solo como cache de la sesion, la refrescamos
                localStorage.setItem('usuarioLogueado', JSON.stringify(data.user));
            } else {
                mensajePerfil.style.color = 'red';
                mensajePerfil.textContent = data.error || 'Ocurrió un error al actualizar el perfil.';
            }
        } catch (error) {
            mensajePerfil.style.color = 'red';
            mensajePerfil.textContent = 'No se pudo conectar con el servidor.';
        }
    });

    // cambiar contraseña
    passwordForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (newPassword !== confirmPassword) {
            mensajePassword.style.color = 'red';
            mensajePassword.textContent = 'Las contraseñas nuevas no coinciden.';
            return;
        }

        try {
            const response = await fetch('/api/profile/password', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ currentPassword, newPassword })
            });

            const data = await response.json();

            if (response.ok) {
                mensajePassword.style.color = 'green';
                mensajePassword.textContent = '¡Contraseña actualizada con éxito!';
                passwordForm.reset();
            } else {
                mensajePassword.style.color = 'red';
                mensajePassword.textContent = data.error || 'Ocurrió un error al cambiar la contraseña.';
            }
        } catch (error) {
            mensajePassword.style.color = 'red';
            mensajePassword.textContent = 'No se pudo conectar con el servidor.';
        }
    });

    cargarPerfil();

    // recuadro reservado para futuras configuraciones (aun sin definir)
    document.getElementById('config-extra-contenedor').appendChild(
        crearEstadoVacio('aca poner otras weas mas adelante.')
    );
    montarHeaderComun();
    </script>

</body>
</html>
