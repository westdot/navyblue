<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar - NAVYBLUE</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232f3e56'/%3E%3Cpath d='M6 6.5C6 5.7 6.7 5 7.5 5H12v14H7.5C6.7 19 6 18.3 6 17.5v-11z' fill='%23f6f1e7'/%3E%3Cpath d='M18 6.5c0-.8-.7-1.5-1.5-1.5H12v14h4.5c.8 0 1.5-.7 1.5-1.5v-11z' fill='%23b9823f'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- TÍTULO PRINCIPAL Y OPCIONES -->
    <header id="inicio-header">
        <div class="header-content">
            <div class="header-title">
                <h1>NAVYBLUE</h1>
                <p>victimas</p>
            </div>
            <div class="header-acciones">
            </div>
        </div>
    </header>

    <main class="contenedor-principal" style="justify-content: center; display: flex;">
        <section class="columna-centro" style="max-width: 650px; width: 100%;">
            <h2>Buscar</h2>

            <!-- Barra de búsqueda (se puede refinar aquí mismo) -->
            <div style="position: relative; margin-bottom: 15px;">
                <input type="text" id="buscar-input" placeholder="Buscar libros, usuarios..."
                       style="width: 100%; box-sizing: border-box; padding: 10px 42px 10px 16px; border-radius: 999px; border: 1px solid var(--color-borde); font-size: 0.95rem;">
                <button type="button" id="buscar-boton" title="Buscar"
                        style="position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 4px; font-size: 1.1rem;">
                    🔍
                </button>
            </div>

            <!-- El filtro de categoría vive AQUÍ, no en el header -->
            <div id="buscar-tabs" style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px;">
                <button type="button" class="tab-categoria" data-tipo="usuarios">Usuarios</button>
                <button type="button" class="tab-categoria" data-tipo="libros">Libros</button>
                <button type="button" class="tab-categoria" data-tipo="editoriales">Editoriales</button>
                <button type="button" class="tab-categoria" data-tipo="mangas">Mangas</button>
                <button type="button" class="tab-categoria" data-tipo="novelas-ligeras">Novelas Ligeras</button>
            </div>

            <div id="buscar-resultados">
                <p style="color: var(--color-texto-suave);">Escribe algo y elige una categoría para buscar.</p>
            </div>
        </section>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <p>Desarrollado por: mis dos cojones</p>
    </footer>

    <style>
        .tab-categoria {
            padding: 7px 14px;
            border-radius: 999px;
            border: 1px solid var(--color-borde);
            background: var(--color-borde);
            color: var(--color-texto);
            cursor: pointer;
            font-size: 0.85rem;
        }
        .tab-categoria.activa {
            background: var(--color-navy-oscuro);
            color: white;
            border-color: var(--color-navy-oscuro);
        }
        #buscar-resultados a:hover {
            background: var(--color-borde);
        }
    </style>

    <script src="js/ui-comunes.js"></script>
    <script src="js/header-comun.js"></script>
    <script>
    const inputBuscar = document.getElementById('buscar-input');
    const botonBuscar = document.getElementById('buscar-boton');
    const tabs = document.querySelectorAll('.tab-categoria');
    const resultados = document.getElementById('buscar-resultados');

    let tipoActual = 'usuarios';

    function marcarTabActiva() {
        tabs.forEach(t => t.classList.toggle('activa', t.dataset.tipo === tipoActual));
    }

    async function buscar() {
        const q = inputBuscar.value.trim();
        if (!q) {
            resultados.innerHTML = '<p style="color: var(--color-texto-suave);">Escribe algo para buscar.</p>';
            return;
        }

        resultados.innerHTML = '<p style="color: var(--color-texto-suave);">Buscando...</p>';

        try {
            const response = await fetch(`/api/search?tipo=${encodeURIComponent(tipoActual)}&q=${encodeURIComponent(q)}`);
            const data = await response.json();

            resultados.innerHTML = '';

            if (!data.implementado) {
                resultados.innerHTML = ''; resultados.appendChild(crearEstadoVacio('Esta categoría todavía no está implementada.'));
                return;
            }
            if (data.resultados.length === 0) {
                resultados.innerHTML = ''; resultados.appendChild(crearEstadoVacio('Sin resultados.'));
                return;
            }

            data.resultados.forEach(item => {
                const esUsuario = tipoActual === 'usuarios';
                const esLibro = tipoActual === 'libros';

                // Para usuarios, todo el bloque es un link que lleva a su perfil (muro.html).
                // Para libros, un link a la ficha del libro (libro.html).
                const div = document.createElement((esUsuario || esLibro) ? 'a' : 'div');
                div.style.cssText = 'display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--color-borde); text-decoration: none; color: inherit;';
                if (esUsuario) {
                    div.href = `muro.html?usuario=${encodeURIComponent(item.titulo)}`;
                    div.style.cursor = 'pointer';
                } else if (esLibro) {
                    div.href = `libro.html?titulo=${encodeURIComponent(item.titulo)}&autor=${encodeURIComponent(item.autor || '')}&portada=${encodeURIComponent(item.portada_url || '')}`;
                    div.style.cursor = 'pointer';
                }

                if (esUsuario) {
                    const avatar = document.createElement('div');
                    const iniciales = item.titulo.replace('@', '').slice(0, 2).toUpperCase();
                    avatar.textContent = iniciales;
                    avatar.style.cssText = 'width: 38px; height: 38px; border-radius: 50%; background: var(--color-navy-oscuro); color: white; display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 700; flex-shrink: 0;';
                    div.appendChild(avatar);
                } else if (item.portada_url) {
                    const img = document.createElement('img');
                    img.src = item.portada_url;
                    img.alt = '';
                    img.style.cssText = 'width: 38px; height: 54px; object-fit: cover; border-radius: 3px; flex-shrink: 0; background: var(--color-borde);';
                    div.appendChild(img);
                } else if (esLibro) {
                    const placeholder = document.createElement('div');
                    placeholder.style.cssText = 'width: 38px; height: 54px; border-radius: 3px; flex-shrink: 0; background: var(--color-navy-claro); display: flex; align-items: center; justify-content: center; font-size: 1rem;';
                    placeholder.textContent = '📖';
                    div.appendChild(placeholder);
                }

                const textos = document.createElement('div');
                textos.style.cssText = 'min-width: 0;';
                const titulo = document.createElement('div');
                titulo.style.fontWeight = 'bold';
                titulo.textContent = item.titulo;
                textos.appendChild(titulo);
                if (item.subtitulo) {
                    const sub = document.createElement('div');
                    sub.style.cssText = 'font-size: 0.85rem; color: var(--color-texto-suave);';
                    sub.textContent = item.subtitulo;
                    textos.appendChild(sub);
                }
                div.appendChild(textos);
                resultados.appendChild(div);
            });
        } catch (error) {
            resultados.innerHTML = '<p style="color: var(--color-texto-suave);">No se pudo buscar.</p>';
        }
    }

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tipoActual = tab.dataset.tipo;
            marcarTabActiva();
            buscar();
        });
    });

    botonBuscar.addEventListener('click', buscar);
    inputBuscar.addEventListener('keyup', (e) => {
        if (e.key === 'Enter') buscar();
    });

    // Si venimos de ?q=... (desde la barra del header), precargamos y buscamos
    window.addEventListener('DOMContentLoaded', () => {
        montarHeaderComun();
        marcarTabActiva();

        const params = new URLSearchParams(window.location.search);
        const q = params.get('q');
        if (q) {
            inputBuscar.value = q;
            buscar();
        }
    });
    </script>

</body>
</html>
