<body>

    <!-- TÍTULO PRINCIPAL Y OPCIONES -->

    <!-- ESTRUCTURA PRINCIPAL EN 3 COLUMNAS (SEGÚN TU BOCETO) -->

        <!-- Tarjeta de bienvenida: tus números y tus lecturas en curso (se arma por JS) -->

        <!-- Izquierda: menú y meta del año -->
        <div class="bento-col area-izq">
            <section class="bento-card orden-2">
                <h2>Menú</h2>

                    <li id="menu-mi-muro" style="display: none;"><a href="muro.html">Mi muro</a></li>

    </main>

    <!-- CAJA FLOTANTE (MODAL) DE INICIO DE SESIÓN -->
    <div id="modal-login" class="modal-overlay">
        <div class="modal-content">
            <span class="cerrar-modal" id="btn-cerrar-login">&times;</span>
            <h2>Iniciar Sesión</h2>
            <form>
                <div class="form-grupo">
                    <label for="email-login">Correo electrónico</label>
                    <input type="email" id="email-login" placeholder="Ingresa tu correo" required>
                </div>
                <div class="form-grupo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                </div>
                <a href="#" class="link-olvido">Olvidé mi contraseña</a>

    <!-- PIE DE PÁGINA -->
    <footer>

    </footer>
    <!-- cript pa achicar el header -->
    <script src="js/ui-comunes.js"></script>
    <script src="js/header-comun.js"></script>
    <script src="js/posts-comunes.js"></script>
    <script src="js/columna-derecha.js"></script>
    <script src="js/libro-buscador.js"></script>
    <script src="js/composer-comun.js"></script>

    <script>
        window.addEventListener('scroll', function() {
            const header = document.getElementById('inicio-header');
            
            // Ahora necesitas bajar más (120px) para que se achique
            if (window.scrollY > 120) {
                header.classList.add('shrink');
            } 
            // Y debes subir casi hasta el tope (menos de 10px) para que vuelva a agrandarse
            else if (window.scrollY < 10) {
                header.classList.remove('shrink');
            }
        });
    
    // ==========================================
        // NUEVO SCRIPT PARA LA CAJA DE INICIO DE SESIÓN
        // ==========================================
        const btnAbrirLogin = document.getElementById('btn-abrir-login');
        const modalLogin = document.getElementById('modal-login');
        const btnCerrarLogin = document.getElementById('btn-cerrar-login');

        // Al hacer clic en Iniciar Sesión, abre la caja
        btnAbrirLogin.addEventListener('click', function(e) {
            e.preventDefault(); // Evita que la página salte hacia arriba
            modalLogin.classList.add('activo');
        });

        // Al hacer clic en la X, la cierra
        btnCerrarLogin.addEventListener('click', function() {
            modalLogin.classList.remove('activo');
        });

        // Al hacer clic en cualquier parte oscura fuera de la caja, también la cierra
        window.addEventListener('click', function(e) {
            if (e.target === modalLogin) {
                modalLogin.classList.remove('activo');
            }
        });

        // ==========================================
    // SCRIPT DE INICIO DE SESIÓN (LOGIN)
    // ==========================================
    const modalForm = modalLogin.querySelector('form');
    
    // Creamos un elemento para mostrar mensajes dentro del modal
    const mensajeLogin = document.createElement('p');
    mensajeLogin.style.cssText = 'margin-top: 10px; text-align: center; font-weight: bold; font-size: 14px;';
    modalForm.appendChild(mensajeLogin);

    modalForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email-login').value;
        const password = modalForm.querySelector('input[type="password"]').value;

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                mensajeLogin.style.color = 'green';
                mensajeLogin.textContent = '¡Inicio de sesión exitoso!';
                
                // Guardamos los datos del usuario en el navegador
                localStorage.setItem('usuarioLogueado', JSON.stringify({
                    name: data.name,
                    username: data.username
                }));

                setTimeout(() => {
                    modalLogin.classList.remove('activo');
                    montarHeaderComun({ reemplazarBotonesInvitado: true }); // Actualiza la barra superior
                }, 1000);
            } else {
                mensajeLogin.style.color = 'red';
                mensajeLogin.textContent = data.error || 'Credenciales inválidas.';
            }
        } catch (error) {
            mensajeLogin.style.color = 'red';
            mensajeLogin.textContent = 'No se pudo conectar con el servidor.';
        }
    });

    // El header (título como botón de inicio, menú de usuario y buscador) vive en header-comun.js
    window.addEventListener('DOMContentLoaded', async () => {
        const sesion = await montarHeaderComun({ reemplazarBotonesInvitado: true });
        // El link de "Insignias" del menú necesita saber de quién mostrarlas
        if (sesion && sesion.loggedIn) {
            const linkInsignias = document.getElementById('link-menu-insignias');
            if (linkInsignias) linkInsignias.href = `insignias.html?usuario=${encodeURIComponent(sesion.user.username)}`;
        }
    });

    // ==========================================
    // SCRIPT PARA EL MURO DE PUBLICACIONES
    // ==========================================
    const feedPosts = document.querySelector('.feed-posts');

    // ==========================================
    // FEED CON SCROLL INFINITO
    // ==========================================
    // El feed mezcla posts, reseñas y preguntas públicas, cada una con su endpoint
    // paginado. crearPaginadorMezclado (ui-comunes.js) las trae por páginas y las
    // entrega ya ordenadas por fecha; crearScrollInfinito pide la siguiente página
    // cuando la persona se acerca al final.
    const paginadorFeed = crearPaginadorMezclado([
        { tipo: 'post', url: '/api/posts', clave: 'posts' },
        { tipo: 'reseña', url: '/api/reviews', clave: 'reviews' },
        { tipo: 'pregunta', url: '/api/questions', clave: 'questions' }
    ], 15);

    let sesionFeed = null;
    let primeraPaginaFeed = true;

    // Trae la siguiente página del feed y la pinta. Devuelve true si aún hay más.
    async function cargarMasFeed() {
        if (!sesionFeed) {
            const respSesion = await fetch('/api/session');
            sesionFeed = await respSesion.json();
        }
        const miId = sesionFeed.loggedIn ? sesionFeed.user.id : null;
        const miUsername = sesionFeed.loggedIn ? sesionFeed.user.username : null;

        const { items, hayMas, obsoleto } = await paginadorFeed.siguiente();
        if (obsoleto) return false; // el feed se reinició mientras cargaba

        if (items.length > 0) {
            if (primeraPaginaFeed) feedPosts.innerHTML = ''; // Limpiamos el feed estático de prueba
            items.forEach(item => {
                if (item._tipo === 'post') {
                    feedPosts.appendChild(crearPostCard(item, miId));
                } else if (item._tipo === 'pregunta') {
                    feedPosts.appendChild(crearPreguntaCard(item));
                } else {
                    const envoltorio = document.createElement('div');
                    envoltorio.className = 'feed-resena';
                    envoltorio.appendChild(crearResenaCard(item, miUsername));
                    feedPosts.appendChild(envoltorio);
                }
            });
        }
        if (primeraPaginaFeed && items.length === 0) {
            feedPosts.innerHTML = '';
            feedPosts.appendChild(crearEstadoVacio('Todavía no hay publicaciones. ¡Sé la primera persona en publicar!'));
        }
        primeraPaginaFeed = false;
        return hayMas;
    }

    const scrollFeed = crearScrollInfinito({
        contenedor: feedPosts,
        cargarMas: cargarMasFeed,
        mensajeFin: 'Llegaste al final 📚'
    });

    // Vuelve a cargar el feed desde el principio (ej. después de publicar algo nuevo)
    function cargarPosts() {
        paginadorFeed.reiniciar();
        primeraPaginaFeed = true;
        feedPosts.innerHTML = '';
        scrollFeed.reiniciar();
    }

    //funcion para el tiempo de los post supongo
    // Función para calcular hace cuánto se publicó (Estilo Twitter)
    function obtenerTiempoRelativo(fechaServidor) {
        if (!fechaServidor) return 'Ahora';

        // Si la fecha del servidor viene como texto plano sin zona horaria, 
        // la convertimos a formato ISO UTC para que el navegador no se equivoque.
        let fechaLimpia = fechaServidor;
        if (typeof fechaServidor === 'string' && !fechaServidor.endsWith('Z') && !fechaServidor.includes('+')) {
            fechaLimpia = fechaServidor.replace(' ', 'T') + 'Z';
        }

        const fechaPost = new Date(fechaLimpia);
        const ahora = new Date();
        const diferenciaSegundos = Math.floor((ahora - fechaPost) / 1000);

        // Si es menor a un minuto
        if (diferenciaSegundos < 60) {
            return 'Ahora';
        }
        
        // Minutos (de 1m hasta 60m)
        const diferenciaMinutos = Math.floor(diferenciaSegundos / 60);
        if (diferenciaMinutos <= 60) {
            return `${diferenciaMinutos}m`;
        }
        
        // Horas (de 1h hasta 24h)
        const diferenciaHoras = Math.floor(diferenciaMinutos / 60);
        if (diferenciaHoras < 24) {
            return `${diferenciaHoras}h`;
        }
        
        // Días
        const diferenciaDias = Math.floor(diferenciaHoras / 24);
        return `${diferenciaDias}d`;
    }

    // Construye la tarjeta de un post usando textContent (no innerHTML) para el
    // contenido que viene de otros usuarios, así nadie puede publicar HTML/JS
    // que se ejecute en la pantalla de los demás (XSS).
    function crearPostCard(post, miId) {
        const article = document.createElement('article');
        article.className = 'post-card';

        const avatar = document.createElement('div');
        avatar.className = 'post-avatar';
        avatar.textContent = '✍️';

        const contenido = document.createElement('div');
        contenido.className = 'post-contenido';

        // --- INICIO DEL HEADER (Nombre, @usuario y tiempo) ---
        const header = document.createElement('div');
        header.className = 'post-header';

        const infoIzquierda = document.createElement('div');
        infoIzquierda.className = 'post-info-izquierda';

        const autor = document.createElement('a');
        autor.className = 'post-autor';
        autor.href = `muro.html?usuario=${encodeURIComponent(post.username)}`;
        autor.style.cssText = 'text-decoration: none; color: inherit;';
        autor.textContent = post.username;
        autor.addEventListener('click', (e) => e.stopPropagation()); // no abrir el detalle del post

        const userTag = document.createElement('span');
        userTag.className = 'post-user';
        userTag.textContent = `@${post.username}`;

        infoIzquierda.appendChild(autor);
        infoIzquierda.appendChild(userTag);

        const tiempo = document.createElement('span');
        tiempo.className = 'post-tiempo';
        // Le pasamos la fecha que viene de tu base de datos. 
        // Normalmente se llama 'createdat', 'fecha' o 'timestamp'
        tiempo.textContent = obtenerTiempoRelativo(post.created_at);
        tiempo.style.cursor = 'pointer';
        tiempo.title = 'Abrir esta publicación';
        // Clic en la hora: abre el post en su propia página (a diferencia del
        // resto de la tarjeta, que abre el detalle acá mismo en la columna derecha)
        tiempo.addEventListener('click', (e) => {
            e.stopPropagation();
            window.location.href = `post.html?id=${post.id}`;
        });

        header.appendChild(infoIzquierda);
        header.appendChild(tiempo);

        // Botón de eliminar: solo aparece en tus propios posts
        if (miId && post.user_id === miId) {
            const btnEliminar = document.createElement('button');
            btnEliminar.type = 'button';
            btnEliminar.title = 'Eliminar publicación';
            btnEliminar.textContent = '🗑️';
            btnEliminar.style.cssText = 'background: none; border: none; cursor: pointer; margin-left: 8px; font-size: 0.9rem;';
            btnEliminar.addEventListener('click', async (e) => {
                e.stopPropagation(); // que no abra el detalle al borrar
                if (!(await confirmarAccion('¿Eliminar esta publicación?'))) return;
                try {
                    const resp = await fetch(`/api/posts/${post.id}`, { method: 'DELETE' });
                    if (resp.ok) {
                        article.remove();
                    } else {
                        const data = await resp.json().catch(() => ({}));
                        mostrarAviso(data.error || 'No se pudo eliminar la publicación.');
                    }
                } catch (error) {
                    mostrarAviso('No se pudo conectar con el servidor.');
                }
            });
            header.appendChild(btnEliminar);
        }
        // --- FIN DEL HEADER ---

        const texto = document.createElement('p');
        texto.className = 'post-texto';
        texto.appendChild(renderizarTextoConMenciones(post.content));

        const badge = document.createElement('div');
        badge.className = 'post-libro-badge';
        const em = document.createElement('em');
        em.textContent = post.tag;
        badge.append('📚 ', em);

        // Ensamblaje final
        contenido.appendChild(header);
        contenido.appendChild(texto);
        contenido.appendChild(badge);
        contenido.appendChild(crearBarraAcciones(post, () => {
            abrirDetallePost(post.id, document.querySelector('.columna-derecha'));
        }));

        article.appendChild(avatar);
        article.appendChild(contenido);

        // Clic en cualquier parte en blanco del post (o la hora) abre el detalle.
        // Los botones de arriba ya cortan la propagación, así que no interfieren.
        article.style.cursor = 'pointer';
        article.addEventListener('click', () => {
            abrirDetallePost(post.id, document.querySelector('.columna-derecha'));
        });

        return article;
    }

    // Construye la tarjeta de una pregunta pública (alguien le preguntó algo a
    // otra persona). Usa textContent para el contenido, igual que crearPostCard.
    function crearPreguntaCard(pregunta) {
        const article = document.createElement('article');
        article.className = 'post-card';

        const avatar = document.createElement('div');
        avatar.className = 'post-avatar';
        avatar.textContent = '❓';

        const contenido = document.createElement('div');
        contenido.className = 'post-contenido';

        const header = document.createElement('div');
        header.className = 'post-header';

        const infoIzquierda = document.createElement('div');
        infoIzquierda.className = 'post-info-izquierda';

        const autorPregunta = document.createElement('a');
        autorPregunta.style.cssText = 'text-decoration: none; color: inherit; font-weight: bold;';
        autorPregunta.href = `muro.html?usuario=${encodeURIComponent(pregunta.asker_username)}`;
        autorPregunta.textContent = pregunta.asker_username;

        const flecha = document.createElement('span');
        flecha.style.cssText = 'color: var(--color-texto-suave); margin: 0 4px;';
        flecha.textContent = '→';

        const autorRespuesta = document.createElement('a');
        autorRespuesta.style.cssText = 'text-decoration: none; color: inherit; font-weight: bold;';
        autorRespuesta.href = `muro.html?usuario=${encodeURIComponent(pregunta.asked_username)}`;
        autorRespuesta.textContent = pregunta.asked_username;

        infoIzquierda.append(autorPregunta, flecha, autorRespuesta);

        const tiempo = document.createElement('span');
        tiempo.className = 'post-tiempo';
        tiempo.textContent = obtenerTiempoRelativo(pregunta.created_at);

        header.appendChild(infoIzquierda);
        header.appendChild(tiempo);

        const texto = document.createElement('p');
        texto.className = 'post-texto';
        texto.textContent = pregunta.content;

        const badge = document.createElement('div');
        badge.className = 'post-libro-badge';
        const em = document.createElement('em');
        em.textContent = 'Pregunta pública';
        badge.append('❓ ', em);

        contenido.appendChild(header);
        contenido.appendChild(texto);
        contenido.appendChild(badge);

        article.appendChild(avatar);
        article.appendChild(contenido);
        return article;
    }

    // Montar el composer + la columna derecha (el feed lo carga el scroll infinito)
    // ==========================================
    // TARJETA DE BIENVENIDA, META DEL AÑO Y MENÚ
    // ==========================================
    const sesionInicio = fetch('/api/session').then(r => r.json()).catch(() => ({ loggedIn: false }));

    function crearTileStat(icono, numero, etiqueta, href) {
        const a = document.createElement('a');
        a.className = 'stat-tile';
        a.href = href;
        a.insertAdjacentHTML('beforeend', iconoSvg(icono, 18));
        const n = document.createElement('div');
        n.className = 'stat-num';
        n.textContent = numero;
        const l = document.createElement('div');
        l.className = 'stat-lbl';
        l.textContent = etiqueta;
        a.append(n, l);
        return a;
    }

    function crearTileLectura(lec) {
        const a = document.createElement('a');
        a.className = 'lectura-tile';
        a.href = `libro.html?titulo=${encodeURIComponent(lec.libro_titulo || '')}&autor=${encodeURIComponent(lec.autor || '')}&portada=${encodeURIComponent(lec.portada_url || '')}`;
        if (lec.portada_url) {
            const img = document.createElement('img');
            img.src = lec.portada_url;
            img.alt = '';
            a.appendChild(img);
        } else {
            const vacia = document.createElement('div');
            vacia.className = 'lectura-portada-vacia';
            vacia.textContent = '📖';
            a.appendChild(vacia);
        }
        const info = document.createElement('div');
        info.className = 'lectura-info';
        const titulo = document.createElement('div');
        titulo.className = 'lectura-titulo';
        titulo.textContent = lec.libro_titulo;
        const pct = lec.paginas_totales ? Math.min(100, Math.round((lec.pagina_actual / lec.paginas_totales) * 100)) : 0;
        const pctTxt = document.createElement('div');
        pctTxt.className = 'lectura-pct';
        pctTxt.textContent = `${pct}% leído`;
        const barra = document.createElement('div');
        barra.className = 'lectura-barra';
        const relleno = document.createElement('i');
        relleno.style.width = pct + '%';
        barra.appendChild(relleno);
        info.append(titulo, pctTxt, barra);
        a.appendChild(info);
        return a;
    }

    async function montarHero() {
        const hero = document.getElementById('hero-inicio');
        const sesion = await sesionInicio;

        if (!sesion.loggedIn) {
            hero.innerHTML = `
                <div class="hero-bienvenida">
                    <h2>Bienvenido a NavyBlue</h2>
                    <p>Tu rincón para hablar de libros, llevar tus lecturas y descubrir qué leen los demás.</p>
                    <button type="button" class="btn-perfil btn-perfil-claro" id="hero-login">Iniciar sesión</button>
                    <a href="registro.html" class="btn-perfil btn-perfil-suave">Registrarse</a>
                </div>`;
            document.getElementById('hero-login').addEventListener('click', () => {
                const abrir = document.getElementById('btn-abrir-login');
                if (abrir) abrir.click();
            });
            return;
        }

        const usuario = sesion.user.username;
        const u = encodeURIComponent(usuario);
        try {
            const [dUser, dRes, dLec] = await Promise.all([
                fetch(`/api/users/${u}`).then(r => r.json()),
                fetch(`/api/users/${u}/resumen`).then(r => r.json()),
                fetch(`/api/users/${u}/lecturas`).then(r => r.json())
            ]);
            hero.innerHTML = '';

            // Zona 1: quién eres
            const zonaUsuario = document.createElement('a');
            zonaUsuario.className = 'hero-usuario';
            zonaUsuario.href = 'muro.html';
            zonaUsuario.style.cssText = 'color: inherit; text-decoration: none;';
            const avatar = document.createElement('div');
            avatar.className = 'hero-avatar';
            if (dUser.user && dUser.user.foto_url) {
                const img = document.createElement('img');
                img.src = dUser.user.foto_url;
                img.alt = '';
                avatar.appendChild(img);
            } else {
                avatar.textContent = usuario.slice(0, 2).toUpperCase();
            }
            const textos = document.createElement('div');
            const nombre = document.createElement('div');
            nombre.className = 'hero-nombre';
            nombre.textContent = (dUser.user && dUser.user.name) || usuario;
            const handle = document.createElement('div');
            handle.className = 'hero-user';
            handle.textContent = `@${usuario}`;
            textos.append(nombre, handle);
            zonaUsuario.append(avatar, textos);

            // Zona 2: tus números
            const stats = document.createElement('div');
            stats.className = 'hero-stats';
            stats.append(
                crearTileStat('libro', dRes.leidos ?? 0, 'Libros leídos', 'estanterias.html'),
                crearTileStat('estante', dRes.leyendo ?? 0, 'Leyendo', 'muro.html'),
                crearTileStat('lapiz', dRes.resenas ?? 0, 'Reseñas', 'muro.html'),
                crearTileStat('usuarios', dRes.amigos ?? 0, 'Amigos', 'muro.html')
            );

            // Zona 3: tus lecturas en curso
            const lecturas = document.createElement('div');
            lecturas.className = 'hero-lecturas';
            const lista = (dLec.lecturas || []).slice(0, 4);
            if (lista.length === 0) {
                const vacio = document.createElement('div');
                vacio.className = 'hero-sin-lecturas';
                vacio.append('Todavía no tienes lecturas en curso. ');
                const enlace = document.createElement('a');
                enlace.href = 'buscar.html';
                enlace.textContent = 'Busca un libro';
                vacio.append(enlace, ' para empezar.');
                lecturas.appendChild(vacio);
            } else {
                lista.forEach(l => lecturas.appendChild(crearTileLectura(l)));
            }

            hero.append(zonaUsuario, stats, lecturas);
        } catch (error) {
            hero.style.display = 'none'; // si algo falla, el inicio sigue funcionando sin la tarjeta
        }
    }

    async function montarTarjetaMetaYMenu() {
        const sesion = await sesionInicio;
        if (!sesion.loggedIn) return;
        document.getElementById('menu-mi-muro').style.display = '';
        try {
            const resp = await fetch(`/api/users/${encodeURIComponent(sesion.user.username)}/meta-lectura`);
            const data = await resp.json();
            if (!resp.ok) return;
            const nLeidos = Number(data.leidos) || 0;
            const nMeta = Number(data.meta) || 0;
            const radio = 50;
            const circ = 2 * Math.PI * radio;
            const fraccion = nMeta ? Math.min(1, nLeidos / nMeta) : 0;
            document.getElementById('meta-inicio').innerHTML = `
                <svg width="118" height="118" viewBox="0 0 118 118" aria-hidden="true">
                    <circle cx="59" cy="59" r="${radio}" fill="none" stroke-width="10" style="stroke: var(--color-borde);"></circle>
                    <circle cx="59" cy="59" r="${radio}" fill="none" stroke-width="10" stroke-linecap="round" transform="rotate(-90 59 59)"
                            stroke-dasharray="${(circ * fraccion).toFixed(1)} ${circ.toFixed(1)}" style="stroke: var(--color-acento);"></circle>
                </svg>
                <div class="meta-anillo-texto">
                    <div class="meta-anillo-num">${nLeidos}${nMeta ? ` <small>/ ${nMeta}</small>` : ''}</div>
                    <div class="meta-anillo-lbl">libro${nLeidos === 1 ? '' : 's'} leído${nLeidos === 1 ? '' : 's'}</div>
                    <div class="meta-anillo-anio">${nMeta ? 'Meta ' : ''}${Number(data.anio) || ''}</div>
                </div>`;
            document.getElementById('tarjeta-meta').style.display = '';
        } catch (error) { /* sin meta: la tarjeta queda oculta */ }
    }

    window.addEventListener('DOMContentLoaded', () => {
        montarHero();
        montarTarjetaMetaYMenu();
        // (el feed se carga solo: el scroll infinito pide la primera página apenas aparece)

        const columnaDerecha = document.querySelector('.columna-derecha');
        cargarColumnaDerecha(columnaDerecha);

        document.getElementById('composer-mount').appendChild(crearComposer({
            onPost: cargarPosts,
            onResena: () => cargarColumnaDerecha(columnaDerecha)
        }));

    });

    </script>

</body>
