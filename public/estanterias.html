<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Estanterías - NAVYBLUE</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%233f4f68'/%3E%3Cpath d='M6 6.5C6 5.7 6.7 5 7.5 5H12v14H7.5C6.7 19 6 18.3 6 17.5v-11z' fill='%23f5efe1'/%3E%3Cpath d='M18 6.5c0-.8-.7-1.5-1.5-1.5H12v14h4.5c.8 0 1.5-.7 1.5-1.5v-11z' fill='%23c08a4e'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- TÍTULO PRINCIPAL Y OPCIONES -->
    <header id="inicio-header">
        <div class="header-content">
            <div class="header-title">
                <h1>NAVYBLUE</h1>
                <p>victimas</p>
            </div>
            <div class="header-acciones">
            </div>
        </div>
    </header>

    <main class="contenedor-principal" style="justify-content: center; display: flex;">
        <section class="columna-centro" style="max-width: 800px; width: 100%;">
            <h2>Mis Estanterías</h2>
            <p style="color: #888; font-size: 0.85rem; margin-top: -8px;">
                Acá puedes crear estanterías, renombrarlas, agregar libros, editarlos o quitarlos.
            </p>

            <div id="estanterias-contenedor" style="margin-top: 20px;">
                <p style="color: #888;">Cargando...</p>
            </div>

            <button type="button" id="btn-nueva-estanteria"
                    style="width: 100%; padding: 10px; border-radius: 999px; border: 1px dashed #34517c; background: none; color: #34517c; cursor: pointer; font-size: 0.9rem; margin-top: 10px;">
                + Nueva estantería
            </button>
        </section>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <p>Desarrollado por: mis dos cojones</p>
    </footer>

    <script src="js/ui-comunes.js"></script>
    <script src="js/header-comun.js"></script>
    <script>
    const contenedor = document.getElementById('estanterias-contenedor');
    let miUsuario = null;

    // --- Formulario para agregar un libro nuevo a una estantería ---
    function crearFormularioLibro(shelfId, onAgregado) {
        const form = document.createElement('div');
        form.style.cssText = 'display: none; margin-top: 10px; padding: 12px; background: #f7f7f7; border-radius: 6px;';

        function campo(placeholder, valorInicial) {
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = placeholder;
            input.value = valorInicial || '';
            input.style.cssText = 'width: 100%; padding: 8px; margin-bottom: 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 0.85rem; box-sizing: border-box;';
            return input;
        }

        const inputTitulo = campo('Título del libro');
        const inputAutor = campo('Autor');
        const inputPortada = campo('URL de portada (opcional)');

        const btnGuardar = document.createElement('button');
        btnGuardar.type = 'button';
        btnGuardar.textContent = 'Agregar';
        btnGuardar.style.cssText = 'padding: 6px 14px; border-radius: 999px; border: none; background: #34517c; color: white; font-size: 0.82rem; cursor: pointer;';

        const mensaje = document.createElement('p');
        mensaje.style.cssText = 'font-size: 0.8rem; margin-top: 6px;';

        btnGuardar.addEventListener('click', async () => {
            const libro_titulo = inputTitulo.value.trim();
            const autor = inputAutor.value.trim();
            const portada_url = inputPortada.value.trim();
            if (!libro_titulo || !autor) {
                mensaje.style.color = 'red';
                mensaje.textContent = 'Completa título y autor.';
                return;
            }
            try {
                const resp = await fetch(`/api/shelves/${shelfId}/items`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ libro_titulo, autor, portada_url })
                });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) {
                    mensaje.style.color = 'red';
                    mensaje.textContent = data.error || 'No se pudo agregar.';
                    return;
                }
                inputTitulo.value = '';
                inputAutor.value = '';
                inputPortada.value = '';
                mensaje.style.color = 'green';
                mensaje.textContent = '¡Agregado!';
                onAgregado();
            } catch (error) {
                mensaje.style.color = 'red';
                mensaje.textContent = 'No se pudo conectar con el servidor.';
            }
        });

        form.appendChild(inputTitulo);
        form.appendChild(inputAutor);
        form.appendChild(inputPortada);
        form.appendChild(btnGuardar);
        form.appendChild(mensaje);

        return form;
    }

    // --- Formulario para editar un libro ya existente (modificar título/autor/portada) ---
    function crearFormularioEdicion(libro, onGuardado, onCancelar) {
        const form = document.createElement('div');
        form.style.cssText = 'margin-top: 8px; padding: 10px; background: #f0f0f0; border-radius: 6px;';

        function campo(placeholder, valorInicial) {
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = placeholder;
            input.value = valorInicial || '';
            input.style.cssText = 'width: 100%; padding: 7px; margin-bottom: 6px; border-radius: 4px; border: 1px solid #ccc; font-size: 0.82rem; box-sizing: border-box;';
            return input;
        }

        const inputTitulo = campo('Título del libro', libro.libro_titulo);
        const inputAutor = campo('Autor', libro.autor);
        const inputPortada = campo('URL de portada (opcional)', libro.portada_url);

        const acciones = document.createElement('div');
        acciones.style.cssText = 'display: flex; gap: 8px;';

        const btnGuardar = document.createElement('button');
        btnGuardar.type = 'button';
        btnGuardar.textContent = 'Guardar cambios';
        btnGuardar.style.cssText = 'padding: 6px 12px; border-radius: 999px; border: none; background: #34517c; color: white; font-size: 0.78rem; cursor: pointer;';

        const btnCancelar = document.createElement('button');
        btnCancelar.type = 'button';
        btnCancelar.textContent = 'Cancelar';
        btnCancelar.style.cssText = 'padding: 6px 12px; border-radius: 999px; border: 1px solid #ccc; background: white; color: #555; font-size: 0.78rem; cursor: pointer;';

        const mensaje = document.createElement('p');
        mensaje.style.cssText = 'font-size: 0.78rem; margin-top: 6px;';

        btnGuardar.addEventListener('click', async () => {
            const libro_titulo = inputTitulo.value.trim();
            const autor = inputAutor.value.trim();
            const portada_url = inputPortada.value.trim();
            if (!libro_titulo || !autor) {
                mensaje.style.color = 'red';
                mensaje.textContent = 'Completa título y autor.';
                return;
            }
            try {
                const resp = await fetch(`/api/shelf-items/${libro.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ libro_titulo, autor, portada_url })
                });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) {
                    mensaje.style.color = 'red';
                    mensaje.textContent = data.error || 'No se pudo guardar.';
                    return;
                }
                onGuardado();
            } catch (error) {
                mensaje.style.color = 'red';
                mensaje.textContent = 'No se pudo conectar con el servidor.';
            }
        });

        btnCancelar.addEventListener('click', onCancelar);

        acciones.appendChild(btnGuardar);
        acciones.appendChild(btnCancelar);

        form.appendChild(inputTitulo);
        form.appendChild(inputAutor);
        form.appendChild(inputPortada);
        form.appendChild(acciones);
        form.appendChild(mensaje);

        return form;
    }

    // --- Una fila de libro dentro de una estantería (con botones Editar / Quitar) ---
    function crearLibroChip(libro, onCambio) {
        const wrapper = document.createElement('div');
        wrapper.style.cssText = 'border-bottom: 1px solid #eee; padding: 8px 0;';

        const fila = document.createElement('div');
        fila.style.cssText = 'display: flex; gap: 10px; align-items: center;';

        const img = document.createElement('img');
        img.src = libro.portada_url || 'https://via.placeholder.com/40x56';
        img.alt = `Portada de ${libro.libro_titulo}`;
        img.style.cssText = 'width: 38px; height: 54px; object-fit: cover; border-radius: 3px; flex-shrink: 0;';
        fila.appendChild(img);

        const info = document.createElement('div');
        info.style.cssText = 'flex: 1; min-width: 0;';
        const titulo = document.createElement('div');
        titulo.style.cssText = 'font-size: 0.9rem; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;';
        titulo.textContent = libro.libro_titulo;
        const autor = document.createElement('div');
        autor.style.cssText = 'font-size: 0.8rem; color: #888;';
        autor.textContent = libro.autor;
        info.appendChild(titulo);
        info.appendChild(autor);
        fila.appendChild(info);

        const btnEditar = document.createElement('button');
        btnEditar.type = 'button';
        btnEditar.textContent = '✏️';
        btnEditar.title = 'Editar este libro';
        btnEditar.style.cssText = 'background: none; border: none; cursor: pointer; font-size: 0.9rem;';

        const btnQuitar = document.createElement('button');
        btnQuitar.type = 'button';
        btnQuitar.textContent = '🗑️';
        btnQuitar.title = 'Quitar de la estantería';
        btnQuitar.style.cssText = 'background: none; border: none; cursor: pointer; font-size: 0.9rem;';

        btnQuitar.addEventListener('click', async () => {
            if (!(await confirmarAccion(`¿Quitar "${libro.libro_titulo}" de esta estantería?`))) return;
            try {
                const resp = await fetch(`/api/shelf-items/${libro.id}`, { method: 'DELETE' });
                if (resp.ok) {
                    onCambio();
                } else {
                    const data = await resp.json().catch(() => ({}));
                    mostrarAviso(data.error || 'No se pudo quitar.');
                }
            } catch (error) {
                mostrarAviso('No se pudo conectar con el servidor.');
            }
        });

        let formEdicion = null;
        btnEditar.addEventListener('click', () => {
            if (formEdicion) {
                formEdicion.remove();
                formEdicion = null;
                return;
            }
            formEdicion = crearFormularioEdicion(
                libro,
                onCambio,
                () => { formEdicion.remove(); formEdicion = null; }
            );
            wrapper.appendChild(formEdicion);
        });

        fila.appendChild(btnEditar);
        fila.appendChild(btnQuitar);
        wrapper.appendChild(fila);

        return wrapper;
    }

    // --- Tarjeta de una estantería completa: título (editable), lista de libros y formulario para agregar ---
    function crearEstanteCard(estante) {
        const div = document.createElement('div');
        div.className = 'publicar-box';
        div.style.cssText = 'margin-bottom: 20px; padding: 15px;';

        const header = document.createElement('div');
        header.style.cssText = 'display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px;';

        const h3 = document.createElement('h3');
        h3.style.cssText = 'margin: 0; font-size: 1.05rem;';
        h3.textContent = estante.nombre;
        header.appendChild(h3);

        const botonesHeader = document.createElement('div');
        botonesHeader.style.cssText = 'display: flex; gap: 6px; flex-shrink: 0;';

        const btnRenombrar = document.createElement('button');
        btnRenombrar.type = 'button';
        btnRenombrar.textContent = '✏️ Renombrar';
        btnRenombrar.style.cssText = 'background: none; border: 1px solid #ccc; border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 0.75rem; color: #555;';
        btnRenombrar.addEventListener('click', async () => {
            const nuevoNombre = prompt('Nuevo nombre de la estantería:', estante.nombre);
            if (!nuevoNombre || !nuevoNombre.trim() || nuevoNombre.trim() === estante.nombre) return;
            try {
                const resp = await fetch(`/api/shelves/${estante.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre: nuevoNombre.trim() })
                });
                if (resp.ok) {
                    cargarEstanterias();
                } else {
                    const data = await resp.json().catch(() => ({}));
                    mostrarAviso(data.error || 'No se pudo renombrar.');
                }
            } catch (error) {
                mostrarAviso('No se pudo conectar con el servidor.');
            }
        });

        const btnBorrarEstante = document.createElement('button');
        btnBorrarEstante.type = 'button';
        btnBorrarEstante.textContent = '🗑️ Eliminar';
        btnBorrarEstante.style.cssText = 'background: none; border: 1px solid #e0a0a0; border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 0.75rem; color: #c0392b;';
        btnBorrarEstante.addEventListener('click', async () => {
            if (!(await confirmarAccion(`¿Eliminar la estantería "${estante.nombre}" y todos sus libros?`))) return;
            try {
                const resp = await fetch(`/api/shelves/${estante.id}`, { method: 'DELETE' });
                if (resp.ok) {
                    cargarEstanterias();
                } else {
                    const data = await resp.json().catch(() => ({}));
                    mostrarAviso(data.error || 'No se pudo eliminar.');
                }
            } catch (error) {
                mostrarAviso('No se pudo conectar con el servidor.');
            }
        });

        botonesHeader.appendChild(btnRenombrar);
        botonesHeader.appendChild(btnBorrarEstante);
        header.appendChild(botonesHeader);
        div.appendChild(header);

        const listaLibros = document.createElement('div');
        if (!estante.libros || estante.libros.length === 0) {
            listaLibros.appendChild(crearEstadoVacio('Vacía por ahora.'));
        } else {
            estante.libros.forEach(libro => {
                listaLibros.appendChild(crearLibroChip(libro, cargarEstanterias));
            });
        }
        div.appendChild(listaLibros);

        const btnMostrarForm = document.createElement('button');
        btnMostrarForm.type = 'button';
        btnMostrarForm.textContent = '+ Agregar libro';
        btnMostrarForm.style.cssText = 'margin-top: 10px; background: none; border: none; color: #34517c; cursor: pointer; font-size: 0.85rem; font-weight: bold;';

        const formAgregar = crearFormularioLibro(estante.id, cargarEstanterias);
        btnMostrarForm.addEventListener('click', () => {
            formAgregar.style.display = formAgregar.style.display === 'none' ? 'block' : 'none';
        });

        div.appendChild(btnMostrarForm);
        div.appendChild(formAgregar);

        return div;
    }

    async function cargarEstanterias() {
        contenedor.innerHTML = '<p style="color: #888;">Cargando...</p>';
        try {
            const resp = await fetch(`/api/users/${encodeURIComponent(miUsuario)}/shelves`);
            const data = await resp.json();
            contenedor.innerHTML = '';

            if (!data.shelves || data.shelves.length === 0) {
                contenedor.appendChild(crearEstadoVacio('Todavía no tienes estanterías. Crea la primera con el botón de abajo.'));
                return;
            }
            data.shelves.forEach(estante => {
                contenedor.appendChild(crearEstanteCard(estante));
            });
        } catch (error) {
            contenedor.innerHTML = '<p style="color: #888;">No se pudieron cargar las estanterías.</p>';
        }
    }

    document.getElementById('btn-nueva-estanteria').addEventListener('click', async () => {
        const nombre = prompt('Nombre de la nueva estantería:');
        if (!nombre || !nombre.trim()) return;
        try {
            const resp = await fetch('/api/shelves', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre: nombre.trim() })
            });
            if (resp.ok) {
                cargarEstanterias();
            } else {
                const dataErr = await resp.json().catch(() => ({}));
                mostrarAviso(dataErr.error || 'No se pudo crear la estantería.');
            }
        } catch (error) {
            mostrarAviso('No se pudo conectar con el servidor.');
        }
    });

    // Punto de entrada: necesitamos sesión activa para saber cuáles son "mis" estanterías
    (async () => {
        try {
            const response = await fetch('/api/session');
            const sesion = await response.json();
            if (!sesion.loggedIn) {
                window.location.href = 'index.html';
                return;
            }
            miUsuario = sesion.user.username;
            montarHeaderComun();
            cargarEstanterias();
        } catch (error) {
            window.location.href = 'index.html';
        }
    })();
    </script>

</body>
</html>
