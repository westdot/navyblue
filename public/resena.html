<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reseña - NAVYBLUE</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232f3e56'/%3E%3Cpath d='M6 6.5C6 5.7 6.7 5 7.5 5H12v14H7.5C6.7 19 6 18.3 6 17.5v-11z' fill='%23f6f1e7'/%3E%3Cpath d='M18 6.5c0-.8-.7-1.5-1.5-1.5H12v14h4.5c.8 0 1.5-.7 1.5-1.5v-11z' fill='%23b9823f'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header id="inicio-header">
        <div class="header-content">
            <div class="header-title">
                <h1>NAVYBLUE</h1>
            </div>
            <div class="header-acciones"></div>
        </div>
    </header>

    <main class="contenedor-principal" style="grid-template-columns: 1fr; max-width: 650px;">
        <section class="columna-centro" id="detalle-resena">
            <p>Cargando reseña...</p>
        </section>
    </main>

    <footer>
        <p>Desarrollado por: mis dos cojones</p>
    </footer>

    <script src="js/ui-comunes.js"></script>
    <script src="js/header-comun.js"></script>
    <script src="js/posts-comunes.js"></script>
    <script src="js/columna-derecha.js"></script>
    <script>
        montarHeaderComun();

        const params = new URLSearchParams(window.location.search);
        const resenaId = params.get('id');
        const contenedor = document.getElementById('detalle-resena');

        if (!resenaId) {
            contenedor.innerHTML = '<p>No se indicó qué reseña mostrar.</p>';
        } else {
            // Al volver, mandamos al inicio en vez de intentar reconstruir un
            // estado que nunca existió en esta página (que solo muestra una reseña).
            contenedor._volverCallback = () => { window.location.href = 'index.html'; };
            abrirDetalleResena(resenaId, contenedor);
        }
    </script>
</body>
</html>
