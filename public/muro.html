<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Muro - NAVYBLUE</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%233f4f68'/%3E%3Cpath d='M6 6.5C6 5.7 6.7 5 7.5 5H12v14H7.5C6.7 19 6 18.3 6 17.5v-11z' fill='%23f5efe1'/%3E%3Cpath d='M18 6.5c0-.8-.7-1.5-1.5-1.5H12v14h4.5c.8 0 1.5-.7 1.5-1.5v-11z' fill='%23c08a4e'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- BARRA SUPERIOR MÍNIMA: sin el título NAVYBLUE, para dejar espacio libre al fondo -->
    <header id="inicio-header" style="min-height: auto;">
        <div class="header-content" style="justify-content: flex-end;">
            <div class="header-acciones">
                <a href="index.html" class="btn-pill">📘</a>
            </div>
        </div>
    </header>

    <!-- ESPACIO RESERVADO PARA EL FONDO DEL MURO (sin gestor de imágenes todavía) -->
    <div id="fondo-muro" style="height: 180px; background: linear-gradient(135deg, var(--color-navy-oscuro), var(--color-navy));"></div>

    <!-- ESTRUCTURA EN 4 COLUMNAS: SOCIAL + LECTOR (antes una sola izquierda) + CENTRO + DERECHA -->
    <main class="contenedor-principal cuatro-columnas">

        <!-- SUB-COLUMNA IZQUIERDA 1: SOCIAL (INFO PERSONAL + AMIGOS + SEGUIDORES/SEGUIDOS) -->
        <aside class="columna-izquierda" id="col-social">
            <h2>Personal</h2>
            <ul class="lista-categorias" id="lista-personal">
                <li>Cargando...</li>
            </ul>

            <!-- Botones de Seguir / Agregar amigo: solo aparecen viendo el muro de OTRA persona -->
            <div id="acciones-relacion" style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px;"></div>

            <div class="divisor-lomo"></div>

            <h2>Seguidos</h2>
            <ul class="lista-categorias" id="lista-seguidos">
                <li>Cargando...</li>
            </ul>

            <h2>Seguidores</h2>
            <ul class="lista-categorias" id="lista-seguidores">
                <li>Cargando...</li>
            </ul>

            <!-- Amigos: separado de Seguir, con su propio divisor -->
            <div class="divisor-lomo"></div>
            <h2>Amigos</h2>
            <ul class="lista-categorias" id="lista-amigos">
                <li>Cargando...</li>
            </ul>
        </aside>

        <!-- SUB-COLUMNA IZQUIERDA 2: LECTOR (LEYENDO AHORA + INSIGNIAS) -->
        <aside class="columna-izquierda" id="col-lector">
            <h2>Leyendo ahora</h2>
            <div id="lecturas-contenedor">
                <p style="font-size: 14px; color: #666;">Cargando...</p>
            </div>

            <div class="divisor-lomo"></div>

            <h2>Insignias</h2>
            <div id="insignias-contenedor" style="display: flex; flex-wrap: wrap; gap: 8px;">
                <p style="font-size: 14px; color: #666;">Cargando...</p>
            </div>
        </aside>

        <!-- COLUMNA CENTRO: MURO -->
        <section class="columna-centro">
            <h2>Muro</h2>

            <!-- Caja para publicar: solo aparece en tu propio muro -->
            <div id="composer-mount"></div>

            <!-- Pestañas: Post / Comentarios / Likes -->
            <div class="publicar-footer" style="display: flex; gap: 0; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; overflow: hidden;">
                <button class="btn-tab-muro tab-activa" data-tab="posts" style="flex: 1; padding: 10px; border: none; cursor: pointer; background: #34517c; color: white;">Post</button>
                <button class="btn-tab-muro" data-tab="comentarios" style="flex: 1; padding: 10px; border: none; cursor: pointer; background: #eee;">Comentarios</button>
                <button class="btn-tab-muro" data-tab="likes" style="flex: 1; padding: 10px; border: none; cursor: pointer; background: #eee;">Likes</button>
            </div>

            <h3 id="titulo-lista">Publicaciones</h3>
            <div class="feed-posts" id="lista-muro">
                <p>Cargando...</p>
            </div>
        </section>

        <!-- COLUMNA DERECHA: ESTANTERÍAS / COLECCIONES DE LIBROS -->
        <aside class="columna-derecha">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 style="margin-bottom: 0; border-bottom: none; padding-bottom: 0;">Estanterías</h2>
                <a id="link-gestionar-estanterias" href="estanterias.html" style="display: none; font-size: 0.75rem; color: #34517c; text-decoration: none; font-weight: bold;">Gestionar</a>
            </div>
            <div style="border-bottom: 2px solid var(--color-borde); margin-bottom: 15px;"></div>
            <div id="estanterias-contenedor">
                <p style="font-size: 14px; color: #666;">Cargando...</p>
            </div>
        </aside>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <p>Desarrollado por: mis dos cojones</p>
    </footer>

    <script src="js/ui-comunes.js"></script>
    <script src="js/header-comun.js"></script>
    <script src="js/posts-comunes.js"></script>
    <script src="js/columna-derecha.js"></script>
    <script src="js/libro-buscador.js"></script>
    <script src="js/composer-comun.js"></script>
    <script src="js/mobile-tabs.js"></script>
    <script>
    const listaPersonal = document.getElementById('lista-personal');
    const listaMuro = document.getElementById('lista-muro');
    const listaSeguidos = document.getElementById('lista-seguidos');
    const listaSeguidores = document.getElementById('lista-seguidores');
    const listaAmigos = document.getElementById('lista-amigos');
    const accionesRelacion = document.getElementById('acciones-relacion');
    const tituloLista = document.getElementById('titulo-lista');
    const botonesTab = document.querySelectorAll('.btn-tab-muro');

    // Formatea la fecha de registro en algo legible, ej: "septiembre de 2026"
    function formatearFecha(fechaISO) {
        if (!fechaISO) return 'Sin registrar';
        const fecha = new Date(fechaISO.replace(' ', 'T') + 'Z');
        return fecha.toLocaleDateString('es-ES', { year: 'numeric', month: 'long' });
    }

    // Construye una tarjeta de post con textContent (no innerHTML) para evitar XSS
    // Misma función que en index.html: fecha relativa estilo Twitter (Ahora/5m/2h/3d)
    function obtenerTiempoRelativo(fechaServidor) {
        if (!fechaServidor) return 'Ahora';

        let fechaLimpia = fechaServidor;
        if (typeof fechaServidor === 'string' && !fechaServidor.endsWith('Z') && !fechaServidor.includes('+')) {
            fechaLimpia = fechaServidor.replace(' ', 'T') + 'Z';
        }

        const fechaPost = new Date(fechaLimpia);
        const ahora = new Date();
        const diferenciaSegundos = Math.floor((ahora - fechaPost) / 1000);

        if (diferenciaSegundos < 60) return 'Ahora';

        const diferenciaMinutos = Math.floor(diferenciaSegundos / 60);
        if (diferenciaMinutos <= 60) return `${diferenciaMinutos}m`;

        const diferenciaHoras = Math.floor(diferenciaMinutos / 60);
        if (diferenciaHoras < 24) return `${diferenciaHoras}h`;

        const diferenciaDias = Math.floor(diferenciaHoras / 24);
        return `${diferenciaDias}d`;
    }

    function crearPostCard(post, esMiMuro) {
        const article = document.createElement('article');
        article.className = 'post-card';

        const avatar = document.createElement('div');
        avatar.className = 'post-avatar';
        avatar.textContent = '✍️';

        const contenido = document.createElement('div');
        contenido.className = 'post-contenido';

        const header = document.createElement('div');
        header.className = 'post-header';
        const autor = document.createElement('a');
        autor.className = 'post-autor';
        autor.href = `muro.html?usuario=${encodeURIComponent(post.username)}`;
        autor.style.cssText = 'text-decoration: none; color: inherit;';
        autor.textContent = post.username;
        autor.addEventListener('click', (e) => e.stopPropagation()); // no abrir el detalle del post
        header.appendChild(autor);

        const tiempo = document.createElement('span');
        tiempo.className = 'post-tiempo';
        tiempo.style.cssText = 'margin-left: auto; font-size: 0.75rem; color: #888;';
        tiempo.textContent = obtenerTiempoRelativo(post.created_at);
        header.appendChild(tiempo);

        // el boton de eliminar solo aparece si estss viendo TU PROPIO muro
        if (esMiMuro) {
            const btnEliminar = document.createElement('button');
            btnEliminar.type = 'button';
            btnEliminar.title = 'Eliminar publicación';
            btnEliminar.textContent = '🗑️';
            btnEliminar.style.cssText = 'background: none; border: none; cursor: pointer; margin-left: 8px; font-size: 0.9rem;';
            btnEliminar.addEventListener('click', async (e) => {
                e.stopPropagation(); // que no abra el detalle al borrar
                if (!(await confirmarAccion('¿Eliminar esta publicación?'))) return;
                try {
                    const resp = await fetch(`/api/posts/${post.id}`, { method: 'DELETE' });
                    if (resp.ok) {
                        article.remove();
                    } else {
                        const data = await resp.json().catch(() => ({}));
                        mostrarAviso(data.error || 'No se pudo eliminar la publicación.');
                    }
                } catch (error) {
                    mostrarAviso('No se pudo conectar con el servidor.');
                }
            });
            header.appendChild(btnEliminar);
        }

        const texto = document.createElement('p');
        texto.className = 'post-texto';
        texto.appendChild(renderizarTextoConMenciones(post.content));

        const badge = document.createElement('div');
        badge.className = 'post-libro-badge';
        const em = document.createElement('em');
        em.textContent = post.tag;
        badge.append('📚 ', em);

        contenido.appendChild(header);
        contenido.appendChild(texto);
        contenido.appendChild(badge);
        contenido.appendChild(crearBarraAcciones(post, () => {
            abrirDetallePost(post.id, document.querySelector('.columna-derecha'));
        }));
        article.appendChild(avatar);
        article.appendChild(contenido);

        // clic en cualquier parte en blanco del post (o la hora) abre el detalle
        article.style.cursor = 'pointer';
        article.addEventListener('click', () => {
            abrirDetallePost(post.id, document.querySelector('.columna-derecha'));
        });

        return article;
    }

    // pinta una lista de nombres (clickeables, van a su muro) dentro de un <ul>
    function pintarListaNombres(ul, nombres, mensajeVacio) {
        ul.innerHTML = '';
        if (nombres.length === 0) {
            const li = document.createElement('li');
            li.style.cssText = 'color: #888; font-size: 0.85rem;';
            li.textContent = mensajeVacio;
            ul.appendChild(li);
            return;
        }
        nombres.forEach(nombre => {
            const li = document.createElement('li');
            li.style.padding = '4px 0';
            const a = document.createElement('a');
            a.href = `muro.html?usuario=${encodeURIComponent(nombre)}`;
            a.style.cssText = 'text-decoration: none; color: inherit;';
            a.textContent = nombre;
            li.appendChild(a);
            ul.appendChild(li);
        });
    }

    // Carga Seguidos / Seguidores de un usuario, y arma el botón de Seguir si corresponde
    async function cargarSeguirInfo(username, esMiMuro) {
        try {
            const response = await fetch(`/api/users/${encodeURIComponent(username)}/seguir-info`);
            const data = await response.json();

            pintarListaNombres(listaSeguidos, data.seguidos, 'No sigue a nadie todavía.');
            pintarListaNombres(listaSeguidores, data.seguidores, 'Nadie lo sigue todavía.');

            if (!esMiMuro) {
                const btnSeguir = document.createElement('button');
                btnSeguir.type = 'button';
                actualizarBotonSeguir(btnSeguir, data.yoLoSigo);
                btnSeguir.addEventListener('click', async () => {
                    try {
                        const resp = await fetch(`/api/follow/${encodeURIComponent(username)}`, { method: 'POST' });
                        const respData = await resp.json().catch(() => ({}));
                        if (!resp.ok) { mostrarAviso(respData.error || 'Debes iniciar sesión.'); return; }
                        actualizarBotonSeguir(btnSeguir, respData.siguiendo);
                        cargarSeguirInfo(username, esMiMuro); // refresca contadores/listas
                    } catch (error) {
                        mostrarAviso('No se pudo conectar con el servidor.');
                    }
                });
                accionesRelacion.appendChild(btnSeguir);
            }
        } catch (error) {
            listaSeguidos.innerHTML = '<li>No se pudo cargar.</li>';
            listaSeguidores.innerHTML = '<li>No se pudo cargar.</li>';
        }
    }

    function actualizarBotonSeguir(btn, siguiendo) {
        btn.textContent = siguiendo ? 'Dejar de seguir' : 'Seguir';
        btn.style.cssText = `padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 0.85rem; border: 1px solid #34517c; background: ${siguiendo ? 'white' : '#34517c'}; color: ${siguiendo ? '#34517c' : 'white'};`;
    }

    // Carga Amigos de un usuario, y arma el botón de amistad según el estado (totalmente
    // separado de Seguir: acá hace falta que la otra persona acepte)
    async function cargarAmigosInfo(username, esMiMuro) {
        try {
            const response = await fetch(`/api/users/${encodeURIComponent(username)}/amigos-info`);
            const data = await response.json();

            pintarListaNombres(listaAmigos, data.amigos, 'Todavía no tiene amigos agregados.');

            if (!esMiMuro) {
                const btnAmigo = document.createElement('button');
                btnAmigo.type = 'button';

                async function accionAmistad(ruta, metodo) {
                    try {
                        const resp = await fetch(`/api/friends/${encodeURIComponent(username)}${ruta}`, { method: metodo });
                        const respData = await resp.json().catch(() => ({}));
                        if (!resp.ok) { mostrarAviso(respData.error || 'Debes iniciar sesión.'); return; }
                        cargarAmigosInfo(username, esMiMuro); // vuelve a armar el botón con el nuevo estado
                    } catch (error) {
                        mostrarAviso('No se pudo conectar con el servidor.');
                    }
                }

                if (data.estado === 'amigos') {
                    btnAmigo.textContent = 'Amigos ✓ (quitar)';
                    btnAmigo.style.cssText = 'padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 0.85rem; border: 1px solid #198754; background: white; color: #198754;';
                    btnAmigo.addEventListener('click', () => accionAmistad('', 'DELETE'));
                } else if (data.estado === 'solicitud_enviada') {
                    btnAmigo.textContent = 'Solicitud enviada (cancelar)';
                    btnAmigo.style.cssText = 'padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 0.85rem; border: 1px solid #ccc; background: #eee; color: #333;';
                    btnAmigo.addEventListener('click', () => accionAmistad('', 'DELETE'));
                } else if (data.estado === 'solicitud_recibida') {
                    btnAmigo.textContent = 'Aceptar solicitud de amistad';
                    btnAmigo.style.cssText = 'padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 0.85rem; border: 1px solid #198754; background: #198754; color: white;';
                    btnAmigo.addEventListener('click', () => accionAmistad('/aceptar', 'POST'));
                } else {
                    btnAmigo.textContent = 'Agregar amigo';
                    btnAmigo.style.cssText = 'padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 0.85rem; border: 1px solid #ccc; background: #eee; color: #333;';
                    btnAmigo.addEventListener('click', () => accionAmistad('/solicitar', 'POST'));
                }

                // Reemplazamos el botón de amistad si ya había uno (sin tocar el de Seguir)
                const anterior = accionesRelacion.querySelector('.btn-amistad');
                if (anterior) anterior.remove();
                btnAmigo.className = 'btn-amistad';
                accionesRelacion.appendChild(btnAmigo);
            }
        } catch (error) {
            listaAmigos.innerHTML = '<li>No se pudo cargar.</li>';
        }
    }

    // Carga los datos de la columna "Personal" de CUALQUIER usuario (perfil público)
    async function cargarPersonal(username, esMiMuro) {
        try {
            const response = await fetch(`/api/users/${encodeURIComponent(username)}`);
            const data = await response.json();
            listaPersonal.innerHTML = '';

            const items = [
                ['Nombre', data.user.name],
                ['País', data.user.pais || 'No especificado'],
                ['Se unió', formatearFecha(data.user.created_at)]
            ];
            items.forEach(([label, valor]) => {
                const li = document.createElement('li');
                li.style.padding = '6px 0';
                const strong = document.createElement('strong');
                strong.textContent = label + ': ';
                li.appendChild(strong);
                li.append(valor);
                listaPersonal.appendChild(li);
            });

        } catch (error) {
            listaPersonal.innerHTML = '<li>No se pudo cargar la información.</li>';
        }
    }

    // Carga las publicaciones del usuario que se está viendo (propio o de otra persona)
    async function cargarMisPosts(username, esMiMuro) {
        listaMuro.innerHTML = '<p>Cargando...</p>';
        try {
            const [respPosts, respReviews] = await Promise.all([
                fetch(`/api/posts?username=${encodeURIComponent(username)}`),
                fetch(`/api/reviews?username=${encodeURIComponent(username)}`)
            ]);
            const dataPosts = await respPosts.json();
            const dataReviews = await respReviews.json();
            listaMuro.innerHTML = '';

            const items = [
                ...dataPosts.posts.map(p => ({ _tipo: 'post', ...p })),
                ...dataReviews.reviews.map(r => ({ _tipo: 'reseña', ...r }))
            ].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            if (items.length === 0) {
                listaMuro.appendChild(crearEstadoVacio(esMiMuro ? 'Todavía no has publicado nada.' : 'Esta persona todavía no ha publicado nada.'));
                return;
            }

            items.forEach(item => {
                if (item._tipo === 'post') {
                    listaMuro.appendChild(crearPostCard(item, esMiMuro));
                } else {
                    const envoltorio = document.createElement('div');
                    envoltorio.style.cssText = 'padding: 12px 0; border-bottom: 1px solid #eee;';
                    envoltorio.appendChild(crearResenaCard(item));
                    listaMuro.appendChild(envoltorio);
                }
            });
        } catch (error) {
            listaMuro.innerHTML = '<p>No se pudieron cargar las publicaciones.</p>';
        }
    }

    // Cambiar entre pestañas (por ahora solo "Post" está implementado de verdad)
    function activarTab(tab, username, esMiMuro) {
        botonesTab.forEach(btn => {
            const activo = btn.dataset.tab === tab;
            btn.style.background = activo ? '#34517c' : '#eee';
            btn.style.color = activo ? 'white' : '#333';
        });

        if (tab === 'posts') {
            tituloLista.textContent = 'Publicaciones';
            cargarMisPosts(username, esMiMuro);
        } else if (tab === 'comentarios') {
            tituloLista.textContent = 'Comentarios';
            listaMuro.innerHTML = ''; listaMuro.appendChild(crearEstadoVacio('Aún no implementado.'));
        } else if (tab === 'likes') {
            tituloLista.textContent = 'Likes';
            listaMuro.innerHTML = ''; listaMuro.appendChild(crearEstadoVacio('Aún no implementado.'));
        }
    }

    // --- ESTANTERÍAS / COLECCIONES DE LIBROS ---

    function crearLibroChip(libro, esMiMuro, alEliminar) {
        const chip = document.createElement('div');
        chip.style.cssText = 'display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid #eee;';

        const img = document.createElement('img');
        img.src = libro.portada_url || 'https://via.placeholder.com/40x56';
        img.alt = `Portada de ${libro.libro_titulo}`;
        img.style.cssText = 'width: 32px; height: 45px; object-fit: cover; border-radius: 3px; flex-shrink: 0;';
        chip.appendChild(img);

        const info = document.createElement('div');
        info.style.cssText = 'flex: 1; min-width: 0;';
        const titulo = document.createElement('div');
        titulo.style.cssText = 'font-size: 0.82rem; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;';
        titulo.textContent = libro.libro_titulo;
        const autor = document.createElement('div');
        autor.style.cssText = 'font-size: 0.75rem; color: #888;';
        autor.textContent = libro.autor;
        info.appendChild(titulo);
        info.appendChild(autor);
        chip.appendChild(info);

        if (esMiMuro) {
            const btnQuitar = document.createElement('button');
            btnQuitar.type = 'button';
            btnQuitar.textContent = '✕';
            btnQuitar.title = 'Quitar de la estantería';
            btnQuitar.style.cssText = 'background: none; border: none; cursor: pointer; color: #999; font-size: 0.8rem;';
            btnQuitar.addEventListener('click', alEliminar);
            chip.appendChild(btnQuitar);
        }

        return chip;
    }

    function crearFormularioLibro(shelfId, onAgregado) {
        const form = document.createElement('div');
        form.style.cssText = 'display: none; margin-top: 8px; padding: 8px; background: #f7f7f7; border-radius: 6px;';

        function campo(placeholder) {
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = placeholder;
            input.style.cssText = 'width: 100%; padding: 6px; margin-bottom: 6px; border-radius: 4px; border: 1px solid #ccc; font-size: 0.8rem; box-sizing: border-box;';
            return input;
        }

        const inputTitulo = campo('Título del libro');
        const inputAutor = campo('Autor');
        const inputPortada = campo('URL de portada (opcional)');

        const btnGuardar = document.createElement('button');
        btnGuardar.type = 'button';
        btnGuardar.textContent = 'Agregar';
        btnGuardar.style.cssText = 'padding: 5px 12px; border-radius: 999px; border: none; background: #34517c; color: white; font-size: 0.78rem; cursor: pointer;';

        const mensaje = document.createElement('p');
        mensaje.style.cssText = 'font-size: 0.75rem; margin-top: 4px;';

        btnGuardar.addEventListener('click', async () => {
            const libro_titulo = inputTitulo.value.trim();
            const autor = inputAutor.value.trim();
            const portada_url = inputPortada.value.trim();
            if (!libro_titulo || !autor) {
                mensaje.style.color = 'red';
                mensaje.textContent = 'Completa título y autor.';
                return;
            }
            try {
                const resp = await fetch(`/api/shelves/${shelfId}/items`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ libro_titulo, autor, portada_url })
                });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) {
                    mensaje.style.color = 'red';
                    mensaje.textContent = data.error || 'No se pudo agregar.';
                    return;
                }
                inputTitulo.value = '';
                inputAutor.value = '';
                inputPortada.value = '';
                mensaje.style.color = 'green';
                mensaje.textContent = '¡Agregado!';
                onAgregado();
            } catch (error) {
                mensaje.style.color = 'red';
                mensaje.textContent = 'No se pudo conectar con el servidor.';
            }
        });

        form.appendChild(inputTitulo);
        form.appendChild(inputAutor);
        form.appendChild(inputPortada);
        form.appendChild(btnGuardar);
        form.appendChild(mensaje);

        activarBuscadorLibro({ inputTitulo, inputAutor, inputPortada });

        return form;
    }

    // Miniatura de solo-portada para la vista resumida del muro (a diferencia
    // de crearLibroChip, que muestra título/autor completos y se usa en
    // estanterias.html, la página de gestión completa).
    function crearPortadaLibro(libro, esMiMuro, alEliminar) {
        const envoltorio = document.createElement('div');
        envoltorio.style.cssText = 'position: relative; width: 60px; flex-shrink: 0;';

        const img = document.createElement('img');
        img.src = libro.portada_url || 'https://via.placeholder.com/60x86';
        img.alt = `Portada de ${libro.libro_titulo}`;
        img.title = `${libro.libro_titulo} — ${libro.autor}`;
        img.style.cssText = 'width: 60px; height: 86px; object-fit: cover; border-radius: 4px; display: block; box-shadow: 0 2px 5px rgba(0,0,0,0.2);';
        envoltorio.appendChild(img);

        if (esMiMuro) {
            const btnQuitar = document.createElement('button');
            btnQuitar.type = 'button';
            btnQuitar.textContent = '✕';
            btnQuitar.title = 'Quitar de la estantería';
            btnQuitar.style.cssText = 'position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; line-height: 16px; padding: 0; border-radius: 50%; border: 1px solid #ccc; background: white; color: #999; cursor: pointer; font-size: 0.7rem; opacity: 0; transition: opacity 0.15s ease;';
            envoltorio.addEventListener('mouseenter', () => { btnQuitar.style.opacity = '1'; });
            envoltorio.addEventListener('mouseleave', () => { btnQuitar.style.opacity = '0'; });
            btnQuitar.addEventListener('click', alEliminar);
            envoltorio.appendChild(btnQuitar);
        }

        return envoltorio;
    }

    function crearEstanteCard(estante, usuarioObjetivo, esMiMuro) {
        const div = document.createElement('div');
        div.style.cssText = 'margin-bottom: 18px;';

        const header = document.createElement('div');
        header.style.cssText = 'display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;';
        const h3 = document.createElement('h3');
        h3.style.fontSize = '0.95rem';
        h3.textContent = estante.nombre;
        header.appendChild(h3);

        if (esMiMuro) {
            const btnBorrarEstante = document.createElement('button');
            btnBorrarEstante.type = 'button';
            btnBorrarEstante.textContent = '🗑️';
            btnBorrarEstante.title = 'Eliminar estantería';
            btnBorrarEstante.style.cssText = 'background: none; border: none; cursor: pointer; font-size: 0.8rem;';
            btnBorrarEstante.addEventListener('click', async () => {
                if (!(await confirmarAccion(`¿Eliminar la estantería "${estante.nombre}" y todos sus libros?`))) return;
                try {
                    const resp = await fetch(`/api/shelves/${estante.id}`, { method: 'DELETE' });
                    if (resp.ok) {
                        cargarEstanterias(usuarioObjetivo, esMiMuro);
                    } else {
                        const data = await resp.json().catch(() => ({}));
                        mostrarAviso(data.error || 'No se pudo eliminar.');
                    }
                } catch (error) {
                    mostrarAviso('No se pudo conectar con el servidor.');
                }
            });
            header.appendChild(btnBorrarEstante);
        }
        div.appendChild(header);

        // Acá en el muro solo mostramos las portadas (máx. 3, las más
        // recientes agregadas). El detalle completo vive en "Gestionar".
        const listaLibros = document.createElement('div');
        listaLibros.style.cssText = 'display: flex; gap: 10px;';
        if (estante.libros.length === 0) {
            listaLibros.appendChild(crearEstadoVacio('Vacía por ahora.'));
        } else {
            estante.libros.slice(0, 3).forEach(libro => {
                listaLibros.appendChild(crearPortadaLibro(libro, esMiMuro, async () => {
                    if (!(await confirmarAccion(`¿Quitar "${libro.libro_titulo}" de esta estantería?`))) return;
                    try {
                        const resp = await fetch(`/api/shelf-items/${libro.id}`, { method: 'DELETE' });
                        if (resp.ok) {
                            cargarEstanterias(usuarioObjetivo, esMiMuro);
                        } else {
                            const data = await resp.json().catch(() => ({}));
                            mostrarAviso(data.error || 'No se pudo quitar.');
                        }
                    } catch (error) {
                        mostrarAviso('No se pudo conectar con el servidor.');
                    }
                }));
            });
        }
        div.appendChild(listaLibros);

        if (esMiMuro) {
            const btnMostrarForm = document.createElement('button');
            btnMostrarForm.type = 'button';
            btnMostrarForm.textContent = '+ Agregar libro';
            btnMostrarForm.style.cssText = 'margin-top: 6px; background: none; border: none; color: #34517c; cursor: pointer; font-size: 0.78rem; font-weight: bold;';

            const form = crearFormularioLibro(estante.id, () => cargarEstanterias(usuarioObjetivo, esMiMuro));
            btnMostrarForm.addEventListener('click', () => {
                form.style.display = form.style.display === 'none' ? 'block' : 'none';
            });

            div.appendChild(btnMostrarForm);
            div.appendChild(form);
        }

        return div;
    }

    async function cargarEstanterias(usuarioObjetivo, esMiMuro) {
        const contenedor = document.getElementById('estanterias-contenedor');
        contenedor.innerHTML = '<p style="font-size: 14px; color: #666;">Cargando...</p>';
        try {
            const resp = await fetch(`/api/users/${encodeURIComponent(usuarioObjetivo)}/shelves`);
            const data = await resp.json();
            contenedor.innerHTML = '';

            if (!data.shelves || data.shelves.length === 0) {
                contenedor.appendChild(crearEstadoVacio(esMiMuro ? 'Todavía no tienes estanterías.' : 'Esta persona todavía no tiene estanterías.'));
            } else {
                data.shelves.forEach(estante => {
                    contenedor.appendChild(crearEstanteCard(estante, usuarioObjetivo, esMiMuro));
                });
            }

            if (esMiMuro) {
                const btnNuevaEstanteria = document.createElement('button');
                btnNuevaEstanteria.type = 'button';
                btnNuevaEstanteria.textContent = '+ Nueva estantería';
                btnNuevaEstanteria.style.cssText = 'width: 100%; padding: 8px; border-radius: 999px; border: 1px dashed #34517c; background: none; color: #34517c; cursor: pointer; font-size: 0.85rem; margin-top: 10px;';
                btnNuevaEstanteria.addEventListener('click', async () => {
                    const nombre = prompt('Nombre de la nueva estantería:');
                    if (!nombre || !nombre.trim()) return;
                    try {
                        const resp = await fetch('/api/shelves', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ nombre: nombre.trim() })
                        });
                        if (resp.ok) {
                            cargarEstanterias(usuarioObjetivo, esMiMuro);
                        } else {
                            const dataErr = await resp.json().catch(() => ({}));
                            mostrarAviso(dataErr.error || 'No se pudo crear la estantería.');
                        }
                    } catch (error) {
                        mostrarAviso('No se pudo conectar con el servidor.');
                    }
                });
                contenedor.appendChild(btnNuevaEstanteria);
            }

            // Igual que en columna-derecha.js: guardamos cómo volver a este estado
            // después de ver el detalle de un post, para no perder los listeners.
            document.querySelector('.columna-derecha')._volverCallback = () => cargarEstanterias(usuarioObjetivo, esMiMuro);
        } catch (error) {
            contenedor.innerHTML = '<p style="font-size: 14px; color: #666;">No se pudieron cargar las estanterías.</p>';
        }
    }

    // --- PROGRESO DE LECTURA ---

    function crearBarraProgreso(pagina, total) {
        const porcentaje = total > 0 ? Math.min(100, Math.round((pagina / total) * 100)) : 0;
        const contenedor = document.createElement('div');
        contenedor.style.cssText = 'background: #e3d9c2; border-radius: 999px; height: 6px; margin: 4px 0; overflow: hidden;';
        const relleno = document.createElement('div');
        relleno.style.cssText = `background: #c08a4e; height: 100%; width: ${porcentaje}%; border-radius: 999px;`;
        contenedor.appendChild(relleno);
        return contenedor;
    }

    function crearLecturaCard(lectura, usuarioObjetivo, esMiMuro) {
        const div = document.createElement('div');
        div.style.cssText = 'display: flex; gap: 8px; margin-bottom: 14px;';

        const img = document.createElement('img');
        img.src = lectura.portada_url || 'https://via.placeholder.com/40x56';
        img.alt = `Portada de ${lectura.libro_titulo}`;
        img.style.cssText = 'width: 34px; height: 48px; object-fit: cover; border-radius: 3px; flex-shrink: 0;';
        div.appendChild(img);

        const info = document.createElement('div');
        info.style.cssText = 'flex: 1; min-width: 0;';

        const titulo = document.createElement('div');
        titulo.style.cssText = 'font-size: 0.82rem; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;';
        titulo.textContent = lectura.libro_titulo;
        info.appendChild(titulo);

        info.appendChild(crearBarraProgreso(lectura.pagina_actual, lectura.paginas_totales));

        const textoPagina = document.createElement('div');
        textoPagina.style.cssText = 'font-size: 0.72rem; color: #888;';
        textoPagina.textContent = `Pág. ${lectura.pagina_actual} de ${lectura.paginas_totales}`;
        info.appendChild(textoPagina);

        if (esMiMuro) {
            const controles = document.createElement('div');
            controles.style.cssText = 'display: flex; gap: 4px; margin-top: 5px; align-items: center;';

            const inputPagina = document.createElement('input');
            inputPagina.type = 'number';
            inputPagina.min = '0';
            inputPagina.max = String(lectura.paginas_totales);
            inputPagina.value = lectura.pagina_actual;
            inputPagina.style.cssText = 'width: 55px; padding: 3px; border-radius: 4px; border: 1px solid #ccc; font-size: 0.75rem;';

            const btnActualizar = document.createElement('button');
            btnActualizar.type = 'button';
            btnActualizar.title = 'Actualizar página';
            btnActualizar.textContent = '🔄';
            btnActualizar.style.cssText = 'padding: 3px 6px; border-radius: 999px; border: none; background: #5b6f8f; color: white; font-size: 0.75rem; cursor: pointer;';

            const btnCompartir = document.createElement('button');
            btnCompartir.type = 'button';
            btnCompartir.title = 'Actualizar y compartir como post';
            btnCompartir.textContent = '📣';
            btnCompartir.style.cssText = 'padding: 3px 6px; border-radius: 999px; border: none; background: #c08a4e; color: white; font-size: 0.7rem; cursor: pointer;';

            const btnQuitar = document.createElement('button');
            btnQuitar.type = 'button';
            btnQuitar.textContent = '🗑️';
            btnQuitar.title = 'Quitar esta lectura';
            btnQuitar.style.cssText = 'background: none; border: none; cursor: pointer; font-size: 0.75rem;';

            async function actualizar(compartir) {
                const pagina = parseInt(inputPagina.value, 10);
                try {
                    const resp = await fetch(`/api/lecturas/${lectura.id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ pagina_actual: pagina, compartir })
                    });
                    const data = await resp.json().catch(() => ({}));
                    if (!resp.ok) {
                        mostrarAviso(data.error || 'No se pudo actualizar.');
                        return;
                    }
                    cargarLecturas(usuarioObjetivo, esMiMuro);
                } catch (error) {
                    mostrarAviso('No se pudo conectar con el servidor.');
                }
            }

            btnActualizar.addEventListener('click', () => actualizar(false));
            btnCompartir.addEventListener('click', () => actualizar(true));
            btnQuitar.addEventListener('click', async () => {
                if (!(await confirmarAccion(`¿Quitar "${lectura.libro_titulo}" de tus lecturas en curso?`))) return;
                try {
                    const resp = await fetch(`/api/lecturas/${lectura.id}`, { method: 'DELETE' });
                    if (resp.ok) {
                        cargarLecturas(usuarioObjetivo, esMiMuro);
                    } else {
                        const data = await resp.json().catch(() => ({}));
                        mostrarAviso(data.error || 'No se pudo quitar.');
                    }
                } catch (error) {
                    mostrarAviso('No se pudo conectar con el servidor.');
                }
            });

            controles.appendChild(inputPagina);
            controles.appendChild(btnActualizar);
            controles.appendChild(btnCompartir);
            controles.appendChild(btnQuitar);
            info.appendChild(controles);
        }

        div.appendChild(info);
        return div;
    }

    async function cargarLecturas(usuarioObjetivo, esMiMuro) {
        const contenedor = document.getElementById('lecturas-contenedor');
        contenedor.innerHTML = '<p style="font-size: 14px; color: #666;">Cargando...</p>';
        try {
            const resp = await fetch(`/api/users/${encodeURIComponent(usuarioObjetivo)}/lecturas`);
            const data = await resp.json();
            contenedor.innerHTML = '';

            if (!data.lecturas || data.lecturas.length === 0) {
                contenedor.appendChild(crearEstadoVacio(esMiMuro ? 'No estás leyendo nada por ahora.' : 'No está leyendo nada por ahora.'));
            } else {
                data.lecturas.forEach(lectura => {
                    contenedor.appendChild(crearLecturaCard(lectura, usuarioObjetivo, esMiMuro));
                });
            }

            if (esMiMuro) {
                const btnNueva = document.createElement('button');
                btnNueva.type = 'button';
                btnNueva.textContent = '+ Empezar una lectura';
                btnNueva.style.cssText = 'width: 100%; padding: 7px; border-radius: 999px; border: 1px dashed #5b6f8f; background: none; color: #5b6f8f; cursor: pointer; font-size: 0.8rem;';
                btnNueva.addEventListener('click', () => {
                    formNuevaLectura.style.display = formNuevaLectura.style.display === 'none' ? 'block' : 'none';
                });

                const formNuevaLectura = document.createElement('div');
                formNuevaLectura.style.cssText = 'display: none; margin-top: 8px; padding: 8px; background: #f7f7f7; border-radius: 6px;';

                function campo(placeholder, tipo) {
                    const input = document.createElement('input');
                    input.type = tipo || 'text';
                    input.placeholder = placeholder;
                    input.style.cssText = 'width: 100%; padding: 6px; margin-bottom: 6px; border-radius: 4px; border: 1px solid #ccc; font-size: 0.8rem; box-sizing: border-box;';
                    return input;
                }
                const inputTitulo = campo('Título del libro');
                const inputAutor = campo('Autor');
                const inputPortada = campo('URL de portada (opcional)');
                const inputTotales = campo('Total de páginas', 'number');

                const btnGuardar = document.createElement('button');
                btnGuardar.type = 'button';
                btnGuardar.textContent = 'Empezar';
                btnGuardar.style.cssText = 'padding: 5px 12px; border-radius: 999px; border: none; background: #5b6f8f; color: white; font-size: 0.78rem; cursor: pointer;';

                const mensaje = document.createElement('p');
                mensaje.style.cssText = 'font-size: 0.75rem; margin-top: 4px;';

                btnGuardar.addEventListener('click', async () => {
                    const libro_titulo = inputTitulo.value.trim();
                    const autor = inputAutor.value.trim();
                    const portada_url = inputPortada.value.trim();
                    const paginas_totales = inputTotales.value.trim();
                    try {
                        const resp = await fetch('/api/lecturas', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ libro_titulo, autor, portada_url, paginas_totales })
                        });
                        const data2 = await resp.json().catch(() => ({}));
                        if (!resp.ok) {
                            mensaje.style.color = 'red';
                            mensaje.textContent = data2.error || 'No se pudo agregar.';
                            return;
                        }
                        cargarLecturas(usuarioObjetivo, esMiMuro);
                    } catch (error) {
                        mensaje.style.color = 'red';
                        mensaje.textContent = 'No se pudo conectar con el servidor.';
                    }
                });

                formNuevaLectura.appendChild(inputTitulo);
                formNuevaLectura.appendChild(inputAutor);
                formNuevaLectura.appendChild(inputPortada);
                formNuevaLectura.appendChild(inputTotales);
                formNuevaLectura.appendChild(btnGuardar);
                formNuevaLectura.appendChild(mensaje);

                activarBuscadorLibro({ inputTitulo, inputAutor, inputPortada, inputPaginas: inputTotales });

                contenedor.appendChild(btnNueva);
                contenedor.appendChild(formNuevaLectura);
            }
        } catch (error) {
            contenedor.innerHTML = '<p style="font-size: 14px; color: #666;">No se pudieron cargar las lecturas.</p>';
        }
    }

    // --- INSIGNIAS / LOGROS ---

    async function cargarInsignias(usuarioObjetivo) {
        const contenedor = document.getElementById('insignias-contenedor');
        try {
            const resp = await fetch(`/api/users/${encodeURIComponent(usuarioObjetivo)}/badges`);
            const data = await resp.json();
            contenedor.innerHTML = '';

            data.badges.forEach(badge => {
                const chip = document.createElement('div');
                chip.title = `${badge.nombre}: ${badge.descripcion}`;
                chip.style.cssText = `
                    width: 42px; height: 42px; border-radius: 50%;
                    display: flex; align-items: center; justify-content: center;
                    font-size: 1.3rem;
                    background: ${badge.desbloqueada ? '#e7ecf3' : '#f0f0f0'};
                    filter: ${badge.desbloqueada ? 'none' : 'grayscale(100%)'};
                    opacity: ${badge.desbloqueada ? '1' : '0.4'};
                    border: 1px solid ${badge.desbloqueada ? '#c08a4e' : '#ddd'};
                `;
                chip.textContent = badge.icono;
                contenedor.appendChild(chip);
            });
        } catch (error) {
            contenedor.innerHTML = '<p style="font-size: 14px; color: #666;">No se pudieron cargar las insignias.</p>';
        }
    }

    // Punto de entrada: confirmamos sesión y cargamos el muro correspondiente
    // (el propio, o el de otra persona si venimos de un link con ?usuario=)
    (async () => {
        try {
            const response = await fetch('/api/session');
            const sesion = await response.json();
            if (!sesion.loggedIn) {
                window.location.href = 'index.html';
                return;
            }

            const params = new URLSearchParams(window.location.search);
            const usuarioObjetivo = params.get('usuario') || sesion.user.username;
            const esMiMuro = usuarioObjetivo === sesion.user.username;

            document.querySelector('.columna-centro h2').textContent = esMiMuro ? 'Mi Muro' : `Muro de ${usuarioObjetivo}`;

            if (esMiMuro) {
                document.getElementById('link-gestionar-estanterias').style.display = 'inline';
            }

            if (esMiMuro) {
                document.getElementById('composer-mount').appendChild(crearComposer({
                    onPost: () => activarTab('posts', usuarioObjetivo, esMiMuro),
                    onResena: () => {} // las reseñas no se muestran en el muro, solo en la columna derecha del inicio
                }));
            }

            cargarPersonal(usuarioObjetivo, esMiMuro);
            cargarSeguirInfo(usuarioObjetivo, esMiMuro);
            cargarEstanterias(usuarioObjetivo, esMiMuro);
            cargarLecturas(usuarioObjetivo, esMiMuro);
            cargarInsignias(usuarioObjetivo);
            cargarAmigosInfo(usuarioObjetivo, esMiMuro);
            activarTab('posts', usuarioObjetivo, esMiMuro);
            montarHeaderComun();

            activarTabsMobile([
                { selector: '#col-social', texto: 'Social' },
                { selector: '#col-lector', texto: 'Lector' },
                { selector: '.columna-centro', texto: 'Muro' },
                { selector: '.columna-derecha', texto: 'Libros' }
            ]);

            botonesTab.forEach(btn => {
                btn.addEventListener('click', () => activarTab(btn.dataset.tab, usuarioObjetivo, esMiMuro));
            });
        } catch (error) {
            window.location.href = 'index.html';
        }
    })();
    </script>

</body>
