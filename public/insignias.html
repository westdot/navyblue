<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insignias - NAVYBLUE</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%233f4f68'/%3E%3Cpath d='M6 6.5C6 5.7 6.7 5 7.5 5H12v14H7.5C6.7 19 6 18.3 6 17.5v-11z' fill='%23f5efe1'/%3E%3Cpath d='M18 6.5c0-.8-.7-1.5-1.5-1.5H12v14h4.5c.8 0 1.5-.7 1.5-1.5v-11z' fill='%23c08a4e'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
    <style>
        .insignia-card {
            display: flex;
            gap: 14px;
            align-items: center;
            padding: 14px;
            border: 1px solid var(--color-borde);
            border-radius: 8px;
            margin-bottom: 12px;
            background: var(--color-papel);
        }
        .insignia-icono {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            flex-shrink: 0;
        }
        .insignia-icono.desbloqueada {
            background: #e7ecf3;
            border: 1px solid var(--color-acento);
        }
        .insignia-icono.bloqueada {
            background: #f0f0f0;
            border: 1px solid #ddd;
            filter: grayscale(100%);
            opacity: 0.5;
        }
        .insignia-info h3 {
            font-size: 1rem;
            margin-bottom: 3px;
        }
        .insignia-info p {
            font-size: 0.85rem;
            color: var(--color-texto-suave);
        }
    </style>
</head>
<body>

    <header id="inicio-header">
        <div class="header-content">
            <div class="header-title">
                <h1>NAVYBLUE</h1>
            </div>
            <div class="header-acciones"></div>
        </div>
    </header>

    <main class="contenedor-principal" style="grid-template-columns: 1fr; max-width: 650px;">
        <section class="columna-centro">
            <h2 id="titulo-insignias">Insignias</h2>

            <h3 style="font-size: 1rem; margin-bottom: 10px;">Obtenidas</h3>
            <div id="lista-obtenidas"><p style="font-size: 14px; color: #666;">Cargando...</p></div>

            <div class="divisor-lomo"></div>

            <h3 style="font-size: 1rem; margin-bottom: 10px;">Por obtener</h3>
            <div id="lista-por-obtener"></div>
        </section>
    </main>

    <footer>
        <p>Desarrollado por: mis dos cojones</p>
    </footer>

    <script src="js/ui-comunes.js"></script>
    <script src="js/header-comun.js"></script>
    <script>
        montarHeaderComun();

        function crearTarjetaInsignia(badge) {
            const div = document.createElement('div');
            div.className = 'insignia-card';

            const icono = document.createElement('div');
            icono.className = 'insignia-icono ' + (badge.desbloqueada ? 'desbloqueada' : 'bloqueada');
            icono.textContent = badge.icono;

            const info = document.createElement('div');
            info.className = 'insignia-info';
            const h3 = document.createElement('h3');
            h3.textContent = badge.nombre;
            const p = document.createElement('p');
            p.textContent = badge.desbloqueada ? badge.descripcion : `Cómo conseguirla: ${badge.descripcion}`;
            info.appendChild(h3);
            info.appendChild(p);

            const pPorcentaje = document.createElement('p');
            pPorcentaje.style.cssText = 'font-size: 0.78rem; color: var(--color-acento-oscuro); font-weight: bold; margin-top: 2px;';
            const personasTexto = badge.personas === 1 ? '1 persona' : `${badge.personas} personas`;
            pPorcentaje.textContent = `La tiene ${personasTexto} de ${badge.total_usuarios} registradas (${badge.porcentaje}%)`;
            info.appendChild(pPorcentaje);

            div.appendChild(icono);
            div.appendChild(info);
            return div;
        }

        async function cargar() {
            const params = new URLSearchParams(window.location.search);
            const usuarioObjetivo = params.get('usuario');
            const listaObtenidas = document.getElementById('lista-obtenidas');
            const listaPorObtener = document.getElementById('lista-por-obtener');

            if (!usuarioObjetivo) {
                listaObtenidas.innerHTML = '<p>No se indicó de qué perfil mostrar las insignias.</p>';
                return;
            }

            document.getElementById('titulo-insignias').textContent = `Insignias de ${usuarioObjetivo}`;

            try {
                const resp = await fetch(`/api/users/${encodeURIComponent(usuarioObjetivo)}/badges`);
                const data = await resp.json();
                if (!resp.ok) {
                    listaObtenidas.innerHTML = `<p>${data.error || 'No se pudo cargar.'}</p>`;
                    return;
                }

                const obtenidas = data.badges.filter(b => b.desbloqueada);
                const porObtener = data.badges.filter(b => !b.desbloqueada);

                listaObtenidas.innerHTML = '';
                if (obtenidas.length === 0) {
                    listaObtenidas.appendChild(crearEstadoVacio('Todavía no ha desbloqueado ninguna insignia.'));
                } else {
                    obtenidas.forEach(b => listaObtenidas.appendChild(crearTarjetaInsignia(b)));
                }

                listaPorObtener.innerHTML = '';
                if (porObtener.length === 0) {
                    listaPorObtener.appendChild(crearEstadoVacio('¡Ya las tiene todas!'));
                } else {
                    porObtener.forEach(b => listaPorObtener.appendChild(crearTarjetaInsignia(b)));
                }
            } catch (error) {
                listaObtenidas.innerHTML = '<p>No se pudo conectar con el servidor.</p>';
            }
        }

        cargar();
    </script>
</body>
</html>
